<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>미로 대탐험 · 아인이의 놀이터</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0fdf4; --ink:#1f2937; --muted:#6b7280;
  --green:#22c55e; --green-d:#15803d;
  --blue:#3b82f6; --blue-d:#1d4ed8;
  --red:#ef4444; --red-d:#b91c1c;
  --card:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;margin:0}
body{
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  background:var(--bg); color:var(--ink);
  user-select:none; overflow-x:hidden; overflow-y:auto;
  display:flex; align-items:center; justify-content:center;
}
button{font-family:inherit;cursor:pointer;border:none}

.home{position:fixed;top:8px;left:8px;min-height:56px;display:inline-flex;align-items:center;font-size:17px;padding:0 20px;z-index:60;background:rgba(255,255,255,.9);
  color:var(--muted);padding:9px 16px;border-radius:999px;font-size:17px;
  text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.08);border:1px solid #e5e7eb}

.screen{display:none;flex-direction:column;align-items:center;justify-content:center;
  width:100%;min-height:100vh;padding:10px 10px 24px}
.screen.on{display:flex;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

h1{font-size:clamp(31px,5.5vh,52px);color:var(--green-d);margin:0 0 10px;text-align:center}
.sub{font-size:clamp(17px,2.9vh,26px);color:var(--muted);margin:0 0 20px;text-align:center}

.chars{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-bottom:22px}
.char{background:#fff;border:4px solid transparent;border-radius:18px;padding:14px 18px;min-height:60px;
  box-shadow:0 4px 12px rgba(0,0,0,.07);transition:transform .15s,border-color .15s;text-align:center}
.char:hover{transform:translateY(-3px)}
.char.sel{border-color:var(--green)}
.char .ico{font-size:clamp(36px,6.5vh,60px);line-height:1.1}
.char canvas{width:clamp(44px,7.3vh,68px);height:clamp(44px,7.3vh,68px);display:block;margin:0 auto}
.char .nm{font-size:clamp(16px,2.5vh,22px);margin-top:6px;white-space:nowrap}

.big{background:var(--blue);color:#fff;font-size:clamp(23px,3.9vh,36px);min-height:64px;white-space:nowrap;
  padding:16px 48px;border-radius:999px;box-shadow:0 6px 0 var(--blue-d);transition:.08s}
.big:active{transform:translateY(5px);box-shadow:0 0 0 var(--blue-d)}

.tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
.tab{background:#e5e7eb;color:#4b5563;padding:12px 22px;border-radius:14px;min-height:54px;
  font-size:clamp(17px,2.6vh,25px);transition:.15s;white-space:nowrap}
.tab.on{background:var(--green);color:#fff}

.card{background:var(--card);border:3px solid #bbf7d0;border-radius:20px;padding:20px 22px;
  box-shadow:0 8px 22px rgba(0,0,0,.06);text-align:center;max-width:640px;width:100%}
.card h3{margin:0 0 16px;font-size:clamp(20px,3.1vh,29px);font-weight:normal}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.stage{background:#fef9c3;border:2px solid #facc15;color:#854d0e;
  font-size:clamp(18px,2.9vh,26px);padding:16px 6px;min-height:62px;border-radius:14px;transition:.12s;white-space:nowrap}
.stage:hover{transform:translateY(-2px)}
.stage.rnd{background:#f3e8ff;border-color:#c084fc;color:#6b21a8}
.link{background:none;color:var(--muted);text-decoration:underline;font-size:18px;padding:14px 10px;min-height:52px;white-space:nowrap}

/* --- game screen --- */
#screen-game{justify-content:flex-start;padding-top:6px}
.bar{display:flex;justify-content:space-between;align-items:center;
  width:100%;max-width:var(--boardW,460px);margin-bottom:6px;padding:0 2px}
.bar h2{margin:0;font-size:clamp(20px,3.1vh,29px);color:var(--blue-d);font-weight:normal;white-space:nowrap}
.quit{background:#fecaca;color:#991b1b;font-size:17px;padding:12px 18px;min-height:52px;border-radius:12px;white-space:nowrap}

#game-canvas{
  touch-action:none;box-shadow:0 8px 20px rgba(0,0,0,.1);border-radius:12px;background:#fff;
  width:var(--boardW,460px);height:var(--boardW,460px);max-width:96vw
}

.pad{margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pad-row{display:flex;gap:14px}
.dbtn{background:var(--green);color:#fff;border-radius:16px;
  width:clamp(64px,9.6vh,80px);height:clamp(64px,9.6vh,80px);
  font-size:clamp(26px,4.4vh,39px);display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 var(--green-d);transition:.07s;touch-action:none}
.dbtn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.tip{font-size:16px;color:var(--muted);margin:6px 0 0;text-align:center}
.steps{font-size:17px;color:var(--muted);white-space:nowrap}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);overflow-y:auto;padding:16px;
  align-items:center;align-items:safe center;justify-content:center;z-index:80}
.modal.on{display:flex}
.modal .box{background:#fff;padding:32px 26px;border-radius:24px;text-align:center;
  max-width:420px;width:92%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin:0 0 10px;font-size:36px;color:var(--green-d)}
.modal p{margin:0 0 20px;color:var(--muted);font-size:21px}
.modal button{display:block;width:100%;margin-top:12px;padding:16px;min-height:62px;border-radius:16px;font-size:24px;white-space:nowrap}
.m-go{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.m-alt{background:#e5e7eb;color:#374151}

.confetti{position:fixed;width:9px;height:9px;animation:fall linear forwards;z-index:90}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
</style>
</head>
<body>

<a class="home" href="../index.html">🏠 놀이터로</a>

<!-- 1. 캐릭터 선택 -->
<div id="screen-start" class="screen on">
  <h1>🌟 아인이의 미로 대탐험 🌟</h1>
  <p class="sub">주인공을 골라서 미로를 탈출해볼까?</p>
  <div class="chars" id="chars">
    <button class="char sel" data-char="dino"><canvas id="preview-dino" width="64" height="64"></canvas><div class="nm">검은 공룡</div></button>
    <button class="char" data-char="car"><div class="ico">🏎️</div><div class="nm">자동차</div></button>
    <button class="char" data-char="soccer"><div class="ico">⚽</div><div class="nm">축구공</div></button>
    <button class="char" data-char="rocket"><div class="ico">🚀</div><div class="nm">우주선</div></button>
    <button class="char" data-char="robot"><div class="ico">🤖</div><div class="nm">로봇</div></button>
  </div>
  <button class="big" onclick="goLevels()">시작하기!</button>
</div>

<!-- 2. 단계 선택 -->
<div id="screen-levels" class="screen">
  <h1 style="color:var(--blue-d)">어떤 미로를 풀어볼까?</h1>
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <h3 id="level-title">1단계 (7살 추천 · 아주 쉬워요!)</h3>
    <div class="stages">
      <button class="stage" onclick="startGame(1)">1 판</button>
      <button class="stage" onclick="startGame(2)">2 판</button>
      <button class="stage" onclick="startGame(3)">3 판</button>
      <button class="stage" onclick="startGame(4)">4 판</button>
      <button class="stage" onclick="startGame(5)">5 판</button>
      <button class="stage rnd" onclick="startGame('random')">🎲 랜덤</button>
    </div>
    <button class="link" onclick="show('screen-start')">처음으로 돌아가기</button>
  </div>
</div>

<!-- 3. 게임 -->
<div id="screen-game" class="screen">
  <div class="bar">
    <h2 id="game-title">1단계 · 1판</h2>
    <span class="steps" id="steps">0 걸음</span>
    <button class="quit" onclick="goLevels()">그만하기</button>
  </div>
  <canvas id="game-canvas"></canvas>
  <div class="pad">
    <button class="dbtn" data-dc="0" data-dr="-1">⬆️</button>
    <div class="pad-row">
      <button class="dbtn" data-dc="-1" data-dr="0">⬅️</button>
      <button class="dbtn" data-dc="0" data-dr="1">⬇️</button>
      <button class="dbtn" data-dc="1" data-dr="0">➡️</button>
    </div>
    <p class="tip">키보드 방향키로도 움직일 수 있어요!</p>
  </div>
</div>

<div class="modal" id="win-modal">
  <div class="box">
    <h2>🎉 참 잘했어요!</h2>
    <p id="win-msg">미로 탈출 성공!</p>
    <button class="m-go" onclick="nextStage()">다음 미로 하기</button>
    <button class="m-alt" onclick="goLevels()">다른 단계 고르기</button>
  </div>
</div>

<script>
"use strict";

/* ===== 상태 ===== */
let selectedCharacter='dino', currentLevel=1, currentStage=1;
let maze=[], mazeCols=0, mazeRows=0, cellSize=0;
let player={c:0,r:0}, goal={c:0,r:0}, playing=false, steps=0, trail=[];

const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');

const dinoPixels=[
"       ███████  ","       ███ ████ ","       ████████ ","       ████████ ",
"       ██████   ","       ████████ ","    ██████      ","   ███████      ",
"  ████████      "," █████████      ","███████████     ","███████████     ",
" ████████       ","  ███████       ","   ███  ██      ","    ██  ██      ",
"    ██  ██      "];

const EMOJI={car:'🏎️',soccer:'⚽',rocket:'🚀',robot:'🤖'};

/* ===== 화면 ===== */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function goLevels(){ playing=false; show('screen-levels'); selectLevel(currentLevel); }

/* 캐릭터 선택 */
document.getElementById('chars').addEventListener('click',e=>{
  const b=e.target.closest('.char'); if(!b) return;
  document.querySelectorAll('.char').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); selectedCharacter=b.dataset.char;
});

/* 단계 탭 */
const LEVEL_TITLES=[
 "1단계 (7살 추천 · 아주 쉬워요!)",
 "2단계 (조금 더 길어졌어요)",
 "3단계 (조심조심 헷갈려요)",
 "4단계 (집중이 필요해요!)",
 "5단계 (형아 누나 수준!)"];
const tabsEl=document.getElementById('tabs');
for(let i=1;i<=5;i++){
  const b=document.createElement('button');
  b.className='tab'+(i===1?' on':''); b.textContent=i+'단계';
  b.onclick=()=>selectLevel(i); tabsEl.appendChild(b);
}
function selectLevel(lv){
  currentLevel=lv;
  [...tabsEl.children].forEach((t,i)=>t.classList.toggle('on',i+1===lv));
  document.getElementById('level-title').textContent=LEVEL_TITLES[lv-1];
}

/* ===== 시드 난수 ===== */
let seed=1;
function rnd(){ let x=Math.sin(seed++)*10000; return x-Math.floor(x); }

/* ===== 게임 시작 ===== */
function startGame(stage){
  currentStage=stage;
  show('screen-game');
  document.getElementById('win-modal').classList.remove('on');

  const sizes=[6,8,11,14,18];
  mazeCols=mazeRows=sizes[currentLevel-1];

  const t=document.getElementById('game-title');
  if(stage==='random'){ t.textContent=currentLevel+'단계 · 랜덤 미로'; seed=Math.floor(Math.random()*99999)+1; }
  else { t.textContent=currentLevel+'단계 · '+stage+'판'; seed=currentLevel*100+stage; }

  generateMaze(mazeCols,mazeRows);
  player={c:0,r:0}; goal={c:mazeCols-1,r:mazeRows-1};
  steps=0; trail=[{c:0,r:0}];
  document.getElementById('steps').textContent='0 걸음';
  playing=true;
  resizeCanvas();
}

function generateMaze(cols,rows){
  maze=[];
  for(let c=0;c<cols;c++){ const col=[];
    for(let r=0;r<rows;r++) col.push({c,r,walls:[true,true,true,true],visited:false});
    maze.push(col); }
  let cur=maze[0][0]; cur.visited=true; const stack=[cur];
  while(stack.length){
    cur=stack[stack.length-1];
    const nb=neighbors(cur);
    if(nb.length){
      const nx=nb[Math.floor(rnd()*nb.length)];
      removeWalls(cur,nx); nx.visited=true; stack.push(nx);
    } else stack.pop();
  }
}
function neighbors(cell){
  const n=[],{c,r}=cell;
  if(r>0&&!maze[c][r-1].visited)n.push(maze[c][r-1]);
  if(c<mazeCols-1&&!maze[c+1][r].visited)n.push(maze[c+1][r]);
  if(r<mazeRows-1&&!maze[c][r+1].visited)n.push(maze[c][r+1]);
  if(c>0&&!maze[c-1][r].visited)n.push(maze[c-1][r]);
  return n;
}
function removeWalls(a,b){
  const dx=a.c-b.c;
  if(dx===1){a.walls[3]=false;b.walls[1]=false;} else if(dx===-1){a.walls[1]=false;b.walls[3]=false;}
  const dy=a.r-b.r;
  if(dy===1){a.walls[0]=false;b.walls[2]=false;} else if(dy===-1){a.walls[2]=false;b.walls[0]=false;}
}

/* ===== 렌더 ===== */
function resizeCanvas(){
  // 넷북(1366x768 등) 세로 공간 우선: 방향패드/헤더 공간을 뺀 크기
  const btnH = Math.min(Math.max(window.innerHeight*0.096,64),80);
  const padH = btnH*2 + 58;              // 방향패드 두 줄 + 안내문
  const avail = window.innerHeight - padH - 78;   // 상단 바 여유
  const size = Math.max(300, Math.floor(Math.min(avail, window.innerWidth*0.92, 470)));
  document.documentElement.style.setProperty('--boardW', size+'px');
  const dpr=window.devicePixelRatio||1;
  canvas.width=size*dpr; canvas.height=size*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cellSize=size/mazeCols;
  draw();
}
window.addEventListener('resize',()=>{ if(playing) resizeCanvas(); });

function draw(){
  const size=cellSize*mazeCols;
  ctx.clearRect(0,0,size,size);
  ctx.fillStyle='#fffbeb'; ctx.fillRect(0,0,size,size);

  // 지나온 길 표시 (스스로 경로를 추적할 수 있게)
  ctx.fillStyle='rgba(134,239,172,.45)';
  trail.forEach(p=>ctx.fillRect(p.c*cellSize+2,p.r*cellSize+2,cellSize-4,cellSize-4));

  ctx.strokeStyle='#475569';
  ctx.lineWidth=Math.max(2.5,Math.floor(cellSize/9));
  ctx.lineCap='round';
  for(let c=0;c<mazeCols;c++)for(let r=0;r<mazeRows;r++){
    const x=c*cellSize,y=r*cellSize,w=maze[c][r].walls;
    ctx.beginPath();
    if(w[0]){ctx.moveTo(x,y);ctx.lineTo(x+cellSize,y);}
    if(w[1]){ctx.moveTo(x+cellSize,y);ctx.lineTo(x+cellSize,y+cellSize);}
    if(w[2]){ctx.moveTo(x,y+cellSize);ctx.lineTo(x+cellSize,y+cellSize);}
    if(w[3]){ctx.moveTo(x,y);ctx.lineTo(x,y+cellSize);}
    ctx.stroke();
  }

  ctx.font=(cellSize*0.68)+'px serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🏠', goal.c*cellSize+cellSize/2, goal.r*cellSize+cellSize/2+1);

  drawPlayer();
}
function drawDino(context,x,y,w,h){
  const pw=w/16,ph=h/17;
  context.fillStyle='#535353';
  for(let r=0;r<dinoPixels.length;r++)for(let c=0;c<16;c++)
    if(dinoPixels[r][c]==='█') context.fillRect(x+c*pw,y+r*ph,pw+0.5,ph+0.5);
}
function drawPlayer(){
  const x=player.c*cellSize, y=player.r*cellSize;
  const m=cellSize*0.16, s=cellSize-m*2;
  if(selectedCharacter==='dino'){ drawDino(ctx,x+m,y+m,s,s); }
  else{
    ctx.font=(s*0.92)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(EMOJI[selectedCharacter]||'⚽', x+cellSize/2, y+cellSize/2+1);
  }
}

/* ===== 입력 (두 칸 이동 방지) ===== */
let lastMove=0;
const MOVE_COOLDOWN=110; // ms

function tryMove(dc,dr){
  const now=performance.now();
  if(now-lastMove<MOVE_COOLDOWN) return;   // 중복 입력 차단
  lastMove=now;
  movePlayer(dc,dr);
}

// pointerdown 하나만 사용 → 터치에서 mousedown이 또 발생하는 문제 제거
document.querySelectorAll('.dbtn').forEach(btn=>{
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    tryMove(parseInt(btn.dataset.dc,10), parseInt(btn.dataset.dr,10));
  });
  btn.addEventListener('contextmenu',e=>e.preventDefault());
});

const KEYMAP={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],
              ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
window.addEventListener('keydown',e=>{
  if(!playing) return;
  const m=KEYMAP[e.code];
  if(!m) return;
  e.preventDefault();
  if(e.repeat) return;          // 키를 누르고 있어도 한 칸만
  tryMove(m[0],m[1]);
},{passive:false});

function movePlayer(dc,dr){
  if(!playing) return;
  const cell=maze[player.c][player.r];
  if(dr===-1&&cell.walls[0])return;
  if(dc===1 &&cell.walls[1])return;
  if(dr===1 &&cell.walls[2])return;
  if(dc===-1&&cell.walls[3])return;

  player.c+=dc; player.r+=dr;
  steps++;
  document.getElementById('steps').textContent=steps+' 걸음';

  // 되돌아오면 지나온 길에서 지우기
  const back=trail.length>1 && trail[trail.length-2].c===player.c && trail[trail.length-2].r===player.r;
  if(back) trail.pop(); else trail.push({c:player.c,r:player.r});

  draw();
  if(player.c===goal.c&&player.r===goal.r) gameClear();
}

/* ===== 클리어 ===== */
function gameClear(){
  playing=false;
  confetti();
  const best=(mazeCols-1)+(mazeRows-1);
  document.getElementById('win-msg').textContent =
    steps<=best ? `${steps}걸음! 최고로 짧은 길을 찾았어요! 🏆` : `${steps}걸음 만에 탈출 성공!`;
  setTimeout(()=>document.getElementById('win-modal').classList.add('on'),280);
}
function nextStage(){
  document.getElementById('win-modal').classList.remove('on');
  if(currentStage==='random') startGame('random');
  else if(currentStage<5) startGame(currentStage+1);
  else if(currentLevel<5){ currentLevel++; startGame(1); }
  else { alert('우와! 모든 미로를 전부 다 풀었어요! 아인이 최고! 👍'); goLevels(); }
}
function confetti(){
  const colors=['#fce18a','#ff726d','#b48def','#f4306d','#3fe0d0'];
  for(let i=0;i<40;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=Math.random()*100+'vw'; d.style.top='-12px';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    if(Math.random()>0.5) d.style.borderRadius='50%';
    d.style.animationDuration=(Math.random()*2+1)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),3200);
  }
}

/* 초기 */
drawDino(document.getElementById('preview-dino').getContext('2d'),0,0,64,64);
</script>
</body>
</html>
