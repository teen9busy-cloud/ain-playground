<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>시계 읽기 대탐험 · 아인이의 놀이터</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕐</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ed;--ink:#1f2937;--muted:#6b7280;--o:#f97316;--o-d:#c2410c;
  --hour:#ef4444;--min:#2563eb;--green:#22c55e;--green-d:#15803d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;margin:0}
body{min-height:100vh;margin:0}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--ink);user-select:none;overflow-x:hidden;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px}
button{font-family:inherit;cursor:pointer;border:none}
.home{position:fixed;top:8px;left:8px;z-index:60;background:rgba(255,255,255,.9);color:var(--muted);
  padding:15px 22px;border-radius:999px;font-size:18px;text-decoration:none;
  box-shadow:0 2px 8px rgba(0,0,0,.08);border:1px solid #e5e7eb}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;
  min-height:calc(100vh - 12px);padding:64px 8px 24px}
.screen.on{display:flex;animation:f .25s}
@keyframes f{from{opacity:0}to{opacity:1}}

h1{font-size:clamp(29px,5.2vh,50px);color:var(--o-d);margin:0 0 4px;text-align:center}
.sub{font-size:clamp(16px,2.6vh,24px);color:var(--muted);margin:0 0 18px}
.box{background:#fff;border:3px solid #fed7aa;border-radius:20px;padding:18px 20px;
  box-shadow:0 6px 18px rgba(0,0,0,.06);margin-bottom:14px;width:min(880px,96vw)}
.box h2{margin:0 0 14px;font-size:clamp(17px,2.6vh,24px);color:var(--o-d);text-align:center;font-weight:normal}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opt{background:#f3f4f6;border:2px solid transparent;color:#6b7280;padding:14px 22px;
  border-radius:14px;font-size:clamp(15px,2.4vh,21px);white-space:nowrap;
  min-height:60px;min-width:60px;display:inline-flex;align-items:center;justify-content:center}
.opt.sel{background:#ffedd5;border-color:var(--o);color:var(--o-d)}
.big{background:var(--green);color:#fff;font-size:clamp(23px,3.6vh,34px);padding:18px 56px;
  border-radius:999px;box-shadow:0 5px 0 var(--green-d);transition:.08s;min-height:70px;margin-top:6px}
.big:active{transform:translateY(5px);box-shadow:0 0 0 var(--green-d)}
/* 넷북처럼 화면이 낮을 때는 설정 화면을 촘촘하게 */
@media (max-height:720px){
  .screen{padding:56px 8px 14px}
  h1{margin-bottom:2px}
  .sub{margin-bottom:10px}
  .box{padding:12px 14px;margin-bottom:10px}
  .box h2{margin-bottom:10px}
  .opts{gap:9px}
  .opt{min-height:54px;padding:10px 16px}
  .big{min-height:62px;padding:14px 46px;margin-top:2px}
}

/* 게임 */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;
  width:min(920px,97vw);margin-bottom:10px}
.bar .q{font-size:clamp(17px,2.6vh,23px);color:var(--o-d)}
.bar .sc{font-size:18px;color:var(--muted)}
.bar .quit{background:#fecaca;color:#991b1b;font-size:17px;padding:13px 20px;border-radius:12px;min-height:52px}

.play{display:flex;gap:clamp(16px,3vw,34px);align-items:center;justify-content:center;flex-wrap:wrap}
canvas#clock{width:var(--cs,300px);height:var(--cs,300px);
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.12));
  touch-action:none;-ms-touch-action:none;cursor:default}
canvas#clock.grabbable{cursor:grab}
canvas#clock.dragging{cursor:grabbing}
.side{display:flex;flex-direction:column;align-items:center;gap:14px}
.ask{font-size:clamp(20px,3.1vh,28px);color:var(--o-d);text-align:center}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ch{background:#fff;border:3px solid #e5e7eb;border-radius:16px;padding:18px 24px;
  font-size:clamp(22px,3.9vh,34px);min-width:172px;min-height:72px;transition:.1s;white-space:nowrap}
.ch:hover{transform:translateY(-2px)}
.ch.right{background:#dcfce7;border-color:var(--green);color:var(--green-d)}
.ch.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.ch:disabled{cursor:default}

.setclock{display:flex;flex-direction:column;gap:12px;align-items:center}
.draghint{background:#e0f2fe;border:2px solid #7dd3fc;color:#075985;border-radius:14px;
  padding:11px 18px;font-size:clamp(15px,2.2vh,20px);white-space:nowrap;text-align:center}
.orhint{color:var(--muted);font-size:clamp(13px,1.9vh,16px);white-space:nowrap}
.setrow{display:flex;align-items:center;gap:12px}
.setrow .lab{width:106px;font-size:19px;text-align:right}
.setrow button{width:64px;height:64px;border-radius:16px;font-size:28px;color:#fff}
.h-btn{background:var(--hour);box-shadow:0 4px 0 #b91c1c}
.m-btn{background:var(--min);box-shadow:0 4px 0 #1e40af}
.setrow .val{min-width:96px;text-align:center;font-size:31px}
.ok{background:var(--green);color:#fff;font-size:25px;padding:16px 44px;border-radius:999px;
  min-height:66px;box-shadow:0 4px 0 var(--green-d)}
.ok:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}

.fb{margin-top:12px;font-size:clamp(18px,2.9vh,26px);min-height:38px;text-align:center}
.fb.good{color:var(--green-d)}
.fb.bad{color:#b91c1c}
.next{margin-top:8px;background:var(--o);color:#fff;font-size:22px;padding:16px 40px;
  border-radius:999px;min-height:60px;box-shadow:0 4px 0 var(--o-d);display:none}
.next.on{display:inline-block}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:safe center;
  justify-content:center;z-index:80;overflow-y:auto;padding:24px 12px}
.modal.on{display:flex}
.modal .m{background:#fff;padding:32px 26px;border-radius:24px;text-align:center;max-width:440px;width:92%;margin:auto}
.modal .em{font-size:70px}
.modal h2{margin:10px 0;font-size:34px;color:var(--green-d)}
.modal p{color:var(--muted);margin:0 0 20px;font-size:19px}
.modal button{width:100%;padding:18px;border-radius:16px;font-size:24px;margin-top:12px;min-height:64px}
.m-go{background:var(--o);color:#fff;box-shadow:0 4px 0 var(--o-d)}
.m-alt{background:#e5e7eb;color:#374151}
</style>
</head>
<body>

<a class="home" href="../index.html">🏠 놀이터로</a>

<div id="s-start" class="screen on">
  <h1>🕐 아인이의 시계 읽기 대탐험</h1>
  <p class="sub">시계 바늘을 보고 몇 시인지 알아맞혀 볼까요?</p>

  <div class="box">
    <h2>1. 어떤 시간까지 배울까요?</h2>
    <div class="opts" id="diffs"></div>
  </div>
  <div class="box">
    <h2>2. 어떻게 풀까요?</h2>
    <div class="opts" id="modes">
      <button class="opt sel" data-mode="read">시계 보고 시간 고르기</button>
      <button class="opt" data-mode="set">시간 보고 바늘 돌리기</button>
      <button class="opt" data-mode="mix">🎲 섞어서</button>
    </div>
  </div>
  <div class="box">
    <h2>3. 몇 문제 풀까요?</h2>
    <div class="opts" id="counts"></div>
  </div>
  <button class="big" onclick="start()">시작하기!</button>
</div>

<div id="s-game" class="screen">
  <div class="bar">
    <span class="q" id="qlab">문제 1 / 10</span>
    <span class="sc" id="score">⭕ 0 ❌ 0</span>
    <button class="quit" onclick="go('s-start')">그만하기</button>
  </div>

  <div class="play">
    <canvas id="clock" width="600" height="600"></canvas>
    <div class="side">
      <div class="ask" id="ask">지금 몇 시일까요?</div>
      <div class="choices" id="choices"></div>
      <div class="setclock" id="setclock" style="display:none">
        <div class="draghint" id="draghint">👆 바늘을 손가락으로 잡고 돌려 보세요!</div>
        <div class="orhint">또는 아래 ➖ ➕ 단추로 움직여도 좋아요</div>
        <div class="setrow">
          <span class="lab" style="color:var(--hour)">짧은 바늘</span>
          <button class="h-btn" onclick="bump('h',-1)">−</button>
          <span class="val" id="hv">3시</span>
          <button class="h-btn" onclick="bump('h',1)">+</button>
        </div>
        <div class="setrow">
          <span class="lab" style="color:var(--min)">긴 바늘</span>
          <button class="m-btn" onclick="bump('m',-1)">−</button>
          <span class="val" id="mv">00분</span>
          <button class="m-btn" onclick="bump('m',1)">+</button>
        </div>
        <button class="ok" onclick="checkSet()">이거예요! ✅</button>
      </div>
      <div class="fb" id="fb"></div>
      <button class="next" id="next" onclick="nextQ()">다음 문제 ➡</button>
    </div>
  </div>
</div>

<div class="modal" id="end">
  <div class="m">
    <div class="em">🎉</div>
    <h2 id="end-title">다 풀었어요!</h2>
    <p id="end-msg"></p>
    <button class="m-go" onclick="start()">한 번 더!</button>
    <button class="m-alt" onclick="go('s-start')">설정 바꾸기</button>
  </div>
</div>

<script>
"use strict";
const DIFFS=[
 {id:'oclock',label:'정각만 (1시, 2시…)',step:60},
 {id:'half',  label:'30분까지 (2시 30분)',step:30},
 {id:'quarter',label:'15분까지',step:15},
 {id:'five',  label:'5분까지 (7시 45분)',step:5}
];
const COUNTS=[5,10,15];
let diff=0, mode='read', total=10;
let qi=0, right=0, wrong=0, answered=false;
let target={h:3,m:0}, guess={h:12,m:0}, curMode='read';
let audioCtx=null;

/* ===== 소리 (WebAudio, 오디오 파일 없음) ===== */
window.__sfx=[];                       // 테스트/검증용 재생 기록
function initAudio(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){ audioCtx=null; }
}
// 첫 사용자 제스처에서 AudioContext 생성/재개
['pointerdown','touchstart','mousedown','keydown'].forEach(ev=>
  window.addEventListener(ev,initAudio,{passive:true}));

function tone(f,at,dur,type,vol){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,at);
  g.gain.setValueAtTime(0.0001,at);
  g.gain.linearRampToValueAtTime(vol,at+0.012);
  g.gain.setValueAtTime(vol,at+dur*0.62);
  g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(at); o.stop(at+dur+0.03);
}
const FANFARE=[523.25,659.25,783.99,1046.5];
function beep(t){
  window.__sfx.push(t);
  if(!audioCtx)return;
  const c=audioCtx.currentTime+0.01;
  if(t==='tick'){ tone(700,c,.06,'sine',.05); }
  // 한 문제 정답 → 짧고 밝은 삑!
  if(t==='good'){ tone(1046.5,c,.075,'triangle',.09); tone(1396.91,c+.065,.11,'triangle',.075); }
  // 틀림 → 부드럽고 낮은 소리 (혼내지 않는 느낌)
  if(t==='bad'){ tone(196,c,.16,'sine',.05); tone(155.56,c+.14,.22,'sine',.045); }
  // 한 판 클리어 → 올라가는 4음 팡파르
  if(t==='win'){ FANFARE.forEach((f,i)=>tone(f,c+i*.085,.14,'square',.08)); }
}

/* 설정 UI */
const diffsEl=document.getElementById('diffs');
DIFFS.forEach((d,i)=>{const b=document.createElement('button');
  b.className='opt'+(i===0?' sel':'');b.textContent=d.label;
  b.onclick=()=>{initAudio();beep('tick');diff=i;
    [...diffsEl.children].forEach((x,k)=>x.classList.toggle('sel',k===i));};
  diffsEl.appendChild(b);});
document.getElementById('modes').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b)return;
  initAudio();beep('tick');mode=b.dataset.mode;
  document.querySelectorAll('#modes .opt').forEach(x=>x.classList.toggle('sel',x===b));});
const countsEl=document.getElementById('counts');
COUNTS.forEach((c,i)=>{const b=document.createElement('button');
  b.className='opt'+(c===10?' sel':'');b.textContent=c+' 문제';
  b.onclick=()=>{initAudio();beep('tick');total=c;
    [...countsEl.children].forEach((x,k)=>x.classList.toggle('sel',COUNTS[k]===c));};
  countsEl.appendChild(b);});

function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.getElementById('end').classList.remove('on');}

/* ===== 시계 그리기 ===== */
const cv=document.getElementById('clock'), cx=cv.getContext('2d');
const S=600, C=300, R=252;
const HLEN=R-130, MLEN=R-58;          // 시침 / 분침 길이
function fit(){
  const s=Math.max(300,Math.floor(Math.min(window.innerHeight-150, window.innerWidth*0.44, 420)));
  document.documentElement.style.setProperty('--cs',s+'px');
}
window.addEventListener('resize',fit);

function drawClock(h,m,opts){
  opts=opts||{};
  cx.clearRect(0,0,S,S);
  // 테두리
  cx.fillStyle='#fff';cx.beginPath();cx.arc(C,C,R,0,Math.PI*2);cx.fill();
  cx.lineWidth=16;cx.strokeStyle='#fb923c';cx.stroke();
  cx.lineWidth=6;cx.strokeStyle='#fed7aa';cx.beginPath();cx.arc(C,C,R-18,0,Math.PI*2);cx.stroke();

  // 분 눈금
  for(let i=0;i<60;i++){
    const a=i*Math.PI/30-Math.PI/2, big=i%5===0;
    cx.strokeStyle=big?'#334155':'#cbd5e1';cx.lineWidth=big?6:3;
    cx.beginPath();
    cx.moveTo(C+Math.cos(a)*(R-30),C+Math.sin(a)*(R-30));
    cx.lineTo(C+Math.cos(a)*(R-(big?54:42)),C+Math.sin(a)*(R-(big?54:42)));
    cx.stroke();
  }
  // 시 숫자
  cx.textAlign='center';cx.textBaseline='middle';
  for(let i=1;i<=12;i++){
    const a=i*Math.PI/6-Math.PI/2;
    cx.fillStyle='#1f2937';cx.font='bold 54px sans-serif';
    cx.fillText(i,C+Math.cos(a)*(R-92),C+Math.sin(a)*(R-92)+3);
    // 분 도우미 숫자 (5, 10, 15 …)
    if(opts.minuteHelp!==false){
      cx.fillStyle='#93c5fd';cx.font='bold 26px sans-serif';
      cx.fillText(((i*5)%60),C+Math.cos(a)*(R-146),C+Math.sin(a)*(R-146)+2);
    }
  }

  const ma=(m/60)*Math.PI*2-Math.PI/2;
  const ha=((h%12)/12 + m/720)*Math.PI*2-Math.PI/2;
  const grab=opts.grab||null, draggable=!!opts.draggable;

  // 짧은 바늘 (시)
  cx.lineCap='round';
  const hx=C+Math.cos(ha)*HLEN, hy=C+Math.sin(ha)*HLEN;
  const mx=C+Math.cos(ma)*MLEN, my=C+Math.sin(ma)*MLEN;
  if(grab==='h'){cx.shadowColor='rgba(239,68,68,.55)';cx.shadowBlur=26;}
  cx.strokeStyle=grab==='h'?'#dc2626':'#ef4444';cx.lineWidth=grab==='h'?30:20;
  cx.beginPath();cx.moveTo(C,C);cx.lineTo(hx,hy);cx.stroke();
  cx.shadowBlur=0;
  // 긴 바늘 (분)
  if(grab==='m'){cx.shadowColor='rgba(37,99,235,.55)';cx.shadowBlur=26;}
  cx.strokeStyle=grab==='m'?'#1d4ed8':'#2563eb';cx.lineWidth=grab==='m'?22:13;
  cx.beginPath();cx.moveTo(C,C);cx.lineTo(mx,my);cx.stroke();
  cx.shadowBlur=0;
  // 손잡이 구슬 (잡을 수 있다는 표시)
  if(draggable){
    [[hx,hy,'#ef4444',grab==='h'],[mx,my,'#2563eb',grab==='m']].forEach(([x,y,col,on])=>{
      cx.fillStyle=col;cx.beginPath();cx.arc(x,y,on?30:21,0,Math.PI*2);cx.fill();
      cx.fillStyle='#fff';cx.beginPath();cx.arc(x,y,on?13:9,0,Math.PI*2);cx.fill();
      if(on){cx.strokeStyle='#fff';cx.lineWidth=5;cx.beginPath();cx.arc(x,y,30,0,Math.PI*2);cx.stroke();}
    });
  }
  // 가운데
  cx.fillStyle='#1f2937';cx.beginPath();cx.arc(C,C,17,0,Math.PI*2);cx.fill();
  cx.fillStyle='#fff';cx.beginPath();cx.arc(C,C,7,0,Math.PI*2);cx.fill();

  // 범례
  cx.font='bold 24px sans-serif';cx.textAlign='left';
  cx.fillStyle='#ef4444';cx.fillText('■ 짧은 바늘 = 시',24,S-52);
  cx.fillStyle='#2563eb';cx.fillText('■ 긴 바늘 = 분',24,S-20);
}

/* ===== 문제 ===== */
function fmt(h,m){ return m===0 ? `${h}시` : `${h}시 ${m}분`; }
function randTime(){
  const step=DIFFS[diff].step;
  const h=1+Math.floor(Math.random()*12);
  const m=Math.floor(Math.random()*(60/step))*step % 60;
  return {h,m:m===60?0:m};
}
function start(){
  initAudio();
  qi=0;right=0;wrong=0;
  document.getElementById('end').classList.remove('on');
  go('s-game'); fit(); nextQ();
}
function nextQ(){
  if(qi>=total){ finish(); return; }
  qi++;answered=false;
  document.getElementById('qlab').textContent=`문제 ${qi} / ${total}`;
  document.getElementById('fb').textContent='';
  document.getElementById('fb').className='fb';
  document.getElementById('next').classList.remove('on');

  curMode = mode==='mix' ? (Math.random()<0.5?'read':'set') : mode;
  target=randTime();

  if(curMode==='read'){
    document.getElementById('setclock').style.display='none';
    document.getElementById('choices').style.display='grid';
    document.getElementById('ask').textContent='지금 몇 시 몇 분일까요?';
    dragging=null; cv.classList.remove('grabbable','dragging');
    drawClock(target.h,target.m);          // 읽기 모드에서는 바늘을 잡을 수 없어요
    buildChoices();
  }else{
    document.getElementById('choices').style.display='none';
    document.getElementById('setclock').style.display='flex';
    document.getElementById('ask').innerHTML=
      `<b style="font-size:1.25em;color:#c2410c">${fmt(target.h,target.m)}</b><br>가 되도록 바늘을 돌려요!`;
    const step=DIFFS[diff].step;
    document.getElementById('draghint').textContent = step>=60
      ? '👆 짧은 바늘을 잡고 돌려 보세요! (긴 바늘은 12에 그대로예요)'
      : `👆 바늘을 손가락으로 잡고 돌려 보세요! (긴 바늘은 ${step}분씩)`;
    guess={h:12,m:0};
    updateSet();
  }
  updateScore();
}
function buildChoices(){
  const step=DIFFS[diff].step;
  const set=new Set([`${target.h}:${target.m}`]);
  const opts=[{...target}];
  let guard=0;
  while(opts.length<4 && guard++<200){
    let t;
    const r=Math.random();
    if(r<0.45) t={h:target.h, m:(target.m + step*(1+Math.floor(Math.random()*3)))%60};   // 분만 다름
    else if(r<0.85) t={h:(target.h % 12)+1, m:target.m};                                  // 시만 다름
    else t=randTime();
    if(t.m===60)t.m=0;
    const k=`${t.h}:${t.m}`;
    if(!set.has(k)){ set.add(k); opts.push(t); }
  }
  opts.sort(()=>Math.random()-0.5);
  const box=document.getElementById('choices');
  box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='ch'; b.textContent=fmt(o.h,o.m);
    b.onclick=()=>pick(b,o);
    box.appendChild(b);
  });
}
function pick(btn,o){
  if(answered) return;
  answered=true;
  const ok = o.h===target.h && o.m===target.m;
  document.querySelectorAll('.ch').forEach(b=>b.disabled=true);
  if(ok){
    btn.classList.add('right'); right++; beep('good');
    feedback(true,'정답이에요! 참 잘했어요! 🎉');
  }else{
    btn.classList.add('wrong'); wrong++; beep('bad');
    document.querySelectorAll('.ch').forEach(b=>{ if(b.textContent===fmt(target.h,target.m)) b.classList.add('right'); });
    feedback(false,`짧은 바늘은 ${target.h}, 긴 바늘은 ${target.m}분을 가리켜요. 정답은 ${fmt(target.h,target.m)} 😊`);
  }
  updateScore();
  document.getElementById('next').classList.add('on');
}

/* 바늘 돌리기 모드 */
function bump(which,dir){
  if(answered) return;
  initAudio(); beep('tick');
  const step=DIFFS[diff].step;
  if(which==='h'){ guess.h=((guess.h-1+dir+12)%12)+1; }
  else { guess.m=(guess.m+dir*step+60)%60; }
  updateSet();
}
function updateSet(){
  document.getElementById('hv').textContent=guess.h+'시';
  document.getElementById('mv').textContent=String(guess.m).padStart(2,'0')+'분';
  drawClock(guess.h,guess.m,{grab:dragging,draggable:canDrag()});
  cv.classList.toggle('grabbable',canDrag());
}

/* ===== 바늘 직접 잡고 돌리기 (마우스 + 터치) ===== */
let dragging=null;                       // 'h' | 'm' | null
const TAU=Math.PI*2;
function canDrag(){ return curMode==='set' && !answered; }
function canvasPos(ev){
  const r=cv.getBoundingClientRect();
  if(!r.width||!r.height) return {x:C,y:C};
  return {x:(ev.clientX-r.left)*(S/r.width), y:(ev.clientY-r.top)*(S/r.height)};
}
function tipOf(which,h,m){
  const a = which==='m' ? (m/60)*TAU-Math.PI/2
                        : ((h%12)/12+m/720)*TAU-Math.PI/2;
  const len = which==='m'?MLEN:HLEN;
  return {x:C+Math.cos(a)*len, y:C+Math.sin(a)*len};
}
function applyDrag(p){
  // 12시를 0으로 하는 회전량(0~1)
  const ang=Math.atan2(p.y-C,p.x-C)+Math.PI/2;
  const turns=((ang/TAU)%1+1)%1;
  const step=DIFFS[diff].step;
  const before=guess.h+':'+guess.m;
  if(dragging==='m'){
    // 분침: 이 단계에 맞는 칸(5·15·30분)으로 딱 붙게
    let mm = step>=60 ? 0 : Math.round(turns*60/step)*step;
    guess.m = ((mm%60)+60)%60;
  }else{
    // 시침: 분만큼 앞서가 있으니 그만큼 빼고 정시로 붙임 (3시 30분 → 3과 4 사이)
    let hh = Math.round(turns*12 - guess.m/60);
    hh = ((hh%12)+12)%12;
    guess.h = hh===0?12:hh;
  }
  if(before!==guess.h+':'+guess.m) beep('tick');
  updateSet();
}
cv.addEventListener('pointerdown',e=>{
  initAudio();
  if(!canDrag()) return;
  const p=canvasPos(e), dx=p.x-C, dy=p.y-C, rr=Math.hypot(dx,dy);
  if(rr<24 || rr>R+50) return;                     // 가운데 못이나 시계 밖은 무시
  const th=tipOf('h',guess.h,guess.m), tm=tipOf('m',guess.h,guess.m);
  const dh=Math.hypot(p.x-th.x,p.y-th.y), dm=Math.hypot(p.x-tm.x,p.y-tm.y);
  dragging = dh<=dm ? 'h' : 'm';                   // 손끝에 더 가까운 바늘을 잡음
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  cv.classList.add('dragging');
  e.preventDefault();
  applyDrag(p);
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(!dragging) return;
  e.preventDefault();
  applyDrag(canvasPos(e));
},{passive:false});
function endDrag(e){
  if(!dragging) return;
  dragging=null;
  cv.classList.remove('dragging');
  try{ cv.releasePointerCapture(e.pointerId); }catch(_){}
  updateSet();
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('lostpointercapture',endDrag);
cv.addEventListener('contextmenu',e=>e.preventDefault());
// 검증용 훅
window.getGuess=()=>({h:guess.h,m:guess.m});
window.getAudioState=()=>audioCtx?audioCtx.state:'none';
window.getCurMode=()=>curMode;
window.isDragging=()=>dragging;
function checkSet(){
  if(answered) return;
  answered=true;
  dragging=null; cv.classList.remove('grabbable','dragging');
  const ok = guess.h===target.h && guess.m===target.m;
  if(ok){ right++; beep('good'); feedback(true,'딱 맞췄어요! 시계 박사님! 🎉'); drawClock(guess.h,guess.m); }
  else{
    wrong++; beep('bad');
    feedback(false,`아쉬워요! ${fmt(target.h,target.m)}는 이렇게 생겼어요 👀`);
    setTimeout(()=>drawClock(target.h,target.m),400);
  }
  updateScore();
  document.getElementById('next').classList.add('on');
}

function feedback(good,text){
  const f=document.getElementById('fb');
  f.textContent=text; f.className='fb '+(good?'good':'bad');
}
function updateScore(){ document.getElementById('score').textContent=`⭕ ${right}  ❌ ${wrong}`; }

function finish(){
  beep('win');
  document.getElementById('end-title').textContent = wrong===0?'전부 다 맞췄어요! 🌟':'다 풀었어요! 🎉';
  document.getElementById('end-msg').textContent = `${total}문제 중 ${right}문제 정답!`;
  document.getElementById('end').classList.add('on');
}

fit();
drawClock(3,0);
</script>
