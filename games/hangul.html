<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한글 낱말 만들기 · 아인이의 놀이터</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔤</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fef2f2;--ink:#1f2937;--muted:#6b7280;--pink:#f43f5e;--pink-d:#be123c;
  --green:#22c55e;--green-d:#15803d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;margin:0}
body{min-height:100vh;margin:0}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--ink);user-select:none;overflow-x:hidden;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px}
button{font-family:inherit;cursor:pointer;border:none}
.home{position:fixed;top:8px;left:8px;z-index:60;background:rgba(255,255,255,.9);color:var(--muted);
  padding:15px 22px;border-radius:999px;font-size:18px;text-decoration:none;
  box-shadow:0 2px 8px rgba(0,0,0,.08);border:1px solid #e5e7eb}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;
  min-height:calc(100vh - 12px);padding:64px 8px 24px}
.screen.on{display:flex;animation:f .25s}
@keyframes f{from{opacity:0}to{opacity:1}}

h1{font-size:clamp(29px,5.2vh,50px);color:var(--pink-d);margin:0 0 4px;text-align:center}
.sub{font-size:clamp(16px,2.6vh,24px);color:var(--muted);margin:0 0 18px}
.box{background:#fff;border:3px solid #fecdd3;border-radius:20px;padding:18px 20px;
  box-shadow:0 6px 18px rgba(0,0,0,.06);margin-bottom:14px;width:min(880px,96vw)}
.box h2{margin:0 0 14px;font-size:clamp(17px,2.6vh,24px);color:var(--pink-d);text-align:center;font-weight:normal}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opt{background:#f3f4f6;border:2px solid transparent;color:#6b7280;padding:14px 22px;
  border-radius:14px;font-size:clamp(15px,2.4vh,21px);white-space:nowrap;
  min-height:60px;min-width:60px;display:inline-flex;align-items:center;justify-content:center}
.opt.sel{background:#ffe4e6;border-color:var(--pink);color:var(--pink-d)}
.big{background:var(--green);color:#fff;font-size:clamp(23px,3.6vh,34px);padding:18px 56px;
  border-radius:999px;box-shadow:0 5px 0 var(--green-d);transition:.08s;min-height:70px;margin-top:6px}
.big:active{transform:translateY(5px);box-shadow:0 0 0 var(--green-d)}
.lvdesc{margin:13px 0 0;text-align:center;color:var(--muted);
  font-size:clamp(14px,2.1vh,18px);line-height:1.45;min-height:26px}
.box.off{opacity:.45}
.box.off .opts{pointer-events:none}
.offnote{display:none;margin:10px 0 0;text-align:center;color:var(--pink-d);font-size:15px}
.box.off .offnote{display:block}
.row2{display:flex;gap:14px;width:min(880px,96vw);align-items:stretch}
.row2 .box{width:auto;flex:1;min-width:0}
@media (max-width:820px){ .row2{flex-direction:column;gap:0} }
/* 넷북처럼 화면이 낮을 때는 설정 화면을 촘촘하게 */
@media (max-height:720px){
  .screen{padding:56px 8px 14px}
  h1{margin-bottom:2px}
  .sub{margin-bottom:10px}
  .box{padding:12px 14px;margin-bottom:10px}
  .box h2{margin-bottom:10px}
  .opts{gap:9px}
  .opt{min-height:54px;padding:10px 16px}
  .lvdesc{margin-top:9px;min-height:20px}
  .row2{gap:10px}
  .big{min-height:62px;padding:14px 46px;margin-top:2px}
}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;
  width:min(960px,97vw);margin-bottom:10px}
.bar .q{font-size:clamp(17px,2.6vh,23px);color:var(--pink-d)}
.bar .s{font-size:18px;color:var(--muted)}
.bar .quit{background:#fecaca;color:#991b1b;font-size:17px;padding:13px 20px;border-radius:12px;min-height:52px}

.stage{display:flex;flex-direction:column;align-items:center;gap:clamp(7px,1.4vh,15px)}
.pic{font-size:clamp(62px,12.5vh,140px);line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.12))}
.pic.q{font-size:clamp(30px,5vh,52px);opacity:.55;filter:none}
.hintline{font-size:clamp(16px,2.5vh,22px);color:var(--muted);min-height:28px;text-align:center}
.sentence{font-size:clamp(17px,2.7vh,25px);color:#9f1239;text-align:center;
  max-width:min(760px,94vw);line-height:1.45}
.sentence b{color:var(--pink);letter-spacing:.06em}

.answer{display:flex;gap:clamp(8px,1.6vh,14px);flex-wrap:wrap;justify-content:center;align-items:flex-end}
.cell{width:var(--cs,72px);height:var(--cs,72px);min-width:64px;min-height:64px;border-radius:16px;background:#fff;
  border:3px dashed #fda4af;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--cs,72px)*.55);color:var(--pink-d);transition:.15s}
.cell.filled{border-style:solid;border-color:var(--pink);background:#fff1f2}
.cell.ok{border-style:solid;border-color:var(--green);background:#dcfce7;color:var(--green-d);animation:pop .35s}
.cell.no{border-style:solid;border-color:#ef4444;background:#fee2e2;animation:shake .32s}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 도전 단계: 자모를 모아 한 글자를 만드는 칸 */
.syl{display:flex;flex-direction:column;align-items:center;gap:5px;
  background:#fff7f8;border:2px solid #fecdd3;border-radius:16px;padding:7px 8px}
.sylout{width:calc(var(--cs,72px)*.92);height:calc(var(--cs,72px)*.92);min-width:52px;min-height:52px;
  border-radius:13px;background:#fff;border:2px solid #fbcfe8;display:flex;
  align-items:center;justify-content:center;font-size:calc(var(--cs,72px)*.55);color:var(--pink-d)}
.sylout.done{background:#dcfce7;border-color:var(--green);color:var(--green-d)}
.jrow{display:flex;gap:5px}
.cell.j{width:calc(var(--cs,72px)*.56);height:calc(var(--cs,72px)*.56);
  min-width:38px;min-height:38px;border-radius:11px;font-size:calc(var(--cs,72px)*.31)}

.tiles{display:flex;flex-wrap:wrap;gap:clamp(10px,1.6vh,14px);justify-content:center;max-width:min(900px,96vw)}
.tile{width:var(--cs,72px);height:var(--cs,72px);min-width:64px;min-height:64px;
  border-radius:16px;background:#fff;
  border:3px solid #e5e7eb;font-size:calc(var(--cs,72px)*.5);color:#1f2937;
  box-shadow:0 4px 0 #d1d5db;transition:.1s}
.tile:active{transform:translateY(4px);box-shadow:0 0 0 #d1d5db}
.tile.used{opacity:.28;pointer-events:none;box-shadow:none}
.tiles.jamo .tile{width:calc(var(--cs,72px)*.78);height:calc(var(--cs,72px)*.78);
  min-width:60px;min-height:60px;font-size:calc(var(--cs,72px)*.42)}

.tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tool{background:#fff;border:2px solid #e5e7eb;color:#4b5563;padding:14px 22px;border-radius:14px;
  font-size:18px;min-height:56px}
.tool.say{background:#e0f2fe;border-color:#7dd3fc;color:#075985}
.tool.hint{background:#fef9c3;border-color:#fde047;color:#854d0e}

.fb{min-height:38px;font-size:clamp(18px,2.9vh,26px);text-align:center}
.fb.good{color:var(--green-d)}
.fb.bad{color:#b91c1c}
.next{background:var(--pink);color:#fff;font-size:22px;padding:16px 40px;border-radius:999px;
  min-height:60px;box-shadow:0 4px 0 var(--pink-d);display:none}
.next.on{display:inline-block}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:safe center;
  justify-content:center;z-index:80;overflow-y:auto;padding:24px 12px}
.modal.on{display:flex}
.modal .m{background:#fff;padding:32px 26px;border-radius:24px;text-align:center;max-width:440px;width:92%;margin:auto}
.modal .em{font-size:70px}
.modal h2{margin:10px 0;font-size:34px;color:var(--green-d)}
.modal p{color:var(--muted);margin:0 0 20px;font-size:19px}
.modal button{width:100%;padding:18px;border-radius:16px;font-size:24px;margin-top:12px;min-height:64px}
.m-go{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-d)}
.m-alt{background:#e5e7eb;color:#374151}
.confetti{position:fixed;width:10px;height:10px;animation:fall linear forwards;z-index:90}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
</style>
</head>
<body>

<a class="home" href="../index.html">🏠 놀이터로</a>

<div id="s-start" class="screen on">
  <h1>🔤 아인이의 한글 낱말 만들기</h1>
  <p class="sub">그림을 보고 글자를 순서대로 눌러 낱말을 만들어요!</p>

  <div class="box">
    <h2>1. 얼마나 어렵게 할까요?</h2>
    <div class="opts" id="levels"></div>
    <p class="lvdesc" id="lvdesc"></p>
  </div>
  <div class="box">
    <h2>2. 무슨 낱말로 놀까요?</h2>
    <div class="opts" id="cats"></div>
  </div>
  <div class="row2">
    <div class="box" id="lenbox">
      <h2>3. 글자 수는?</h2>
      <div class="opts" id="lens">
        <button class="opt sel" data-len="2">두 글자</button>
        <button class="opt" data-len="3">세 글자</button>
        <button class="opt" data-len="0">🎲 섞어서</button>
      </div>
      <p class="offnote">이 단계는 낱말 길이가 정해져 있어요 🙂</p>
    </div>
    <div class="box">
      <h2>4. 몇 문제 풀까요?</h2>
      <div class="opts" id="counts"></div>
    </div>
  </div>
  <button class="big" onclick="start()">시작하기!</button>
</div>

<div id="s-game" class="screen">
  <div class="bar">
    <span class="q" id="qlab">문제 1 / 10</span>
    <span class="s" id="score">⭕ 0 ❌ 0</span>
    <button class="quit" onclick="go('s-start')">그만하기</button>
  </div>

  <div class="stage">
    <div class="pic" id="pic">🍎</div>
    <div class="sentence" id="sentence" style="display:none"></div>
    <div class="hintline" id="hintline">이 그림은 무엇일까요?</div>
    <div class="answer" id="answer"></div>
    <div class="tiles" id="tiles"></div>
    <div class="tools">
      <button class="tool" id="undoBtn" onclick="undo()">↩️ 하나 지우기</button>
      <button class="tool hint" id="hintBtn" onclick="hint()">💡 힌트</button>
      <button class="tool say" onclick="speak()">🔊 읽어주기</button>
    </div>
    <div class="fb" id="fb"></div>
    <button class="next" id="next" onclick="nextQ()">다음 문제 ➡</button>
  </div>
</div>

<div class="modal" id="end">
  <div class="m">
    <div class="em">🎉</div>
    <h2 id="end-title">다 풀었어요!</h2>
    <p id="end-msg"></p>
    <button class="m-go" onclick="start()">한 번 더!</button>
    <button class="m-alt" onclick="go('s-start')">설정 바꾸기</button>
  </div>
</div>

/* ===== 소리 (WebAudio, 오디오 파일 없음) ===== */
window.__sfx=[];
function initAudio(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){ audioCtx=null; }
}
['pointerdown','touchstart','mousedown','keydown'].forEach(ev=>
  window.addEventListener(ev,initAudio,{passive:true}));

function tone(f,at,dur,type,vol){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,at);
  g.gain.setValueAtTime(0.0001,at);
  g.gain.linearRampToValueAtTime(vol,at+0.012);
  g.gain.setValueAtTime(vol,at+dur*0.62);
  g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(at); o.stop(at+dur+0.03);
}
const FANFARE=[523.25,659.25,783.99,1046.5];
function beep(t){
  window.__sfx.push(t);
  if(!audioCtx)return;
  const c=audioCtx.currentTime+0.01;
  if(t==='tap'){ tone(660,c,.06,'sine',.05); }
  // 한 낱말 정답 → 짧고 밝은 삑!
  if(t==='good'){ tone(1046.5,c,.075,'triangle',.09); tone(1396.91,c+.065,.11,'triangle',.075); }
  // 한 글자 완성 → 아주 짧은 딩
  if(t==='syl'){ tone(880,c,.07,'triangle',.06); }
  // 틀림 → 부드럽고 낮은 소리
  if(t==='bad'){ tone(196,c,.16,'sine',.05); tone(155.56,c+.14,.22,'sine',.045); }
  // 한 판 클리어 → 올라가는 4음 팡파르
  if(t==='win'){ FANFARE.forEach((f,i)=>tone(f,c+i*.085,.14,'square',.08)); }
}

/* ===== 한글 자모 분해·조합 ===== */
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function decomp(ch){
  const c=ch.charCodeAt(0)-0xAC00;
  if(c<0||c>11171) return null;
  return {cho:Math.floor(c/588), jung:Math.floor((c%588)/28), jong:c%28};
}
function comp(ci,vi,ji){ return String.fromCharCode(0xAC00+ci*588+vi*28+(ji||0)); }
function splitWord(word){          // [{syl:'수',parts:['ㅅ','ㅜ']}, ...]
  const out=[];
  for(const ch of word){
    const d=decomp(ch);
    if(!d){ out.push({syl:ch,parts:[ch]}); continue; }
    const parts=[CHO[d.cho],JUNG[d.jung]];
    if(d.jong) parts.push(JONG[d.jong]);
    out.push({syl:ch,parts});
  }
  return out;
}

/* ===== 그럴듯한 방해 글자 만들기 ===== */
const CHO_GROUPS=[['ㄱ','ㅋ','ㄲ'],['ㄴ','ㄷ','ㄸ','ㅌ'],['ㅁ','ㅂ','ㅃ','ㅍ'],
                  ['ㅅ','ㅆ','ㅈ','ㅉ','ㅊ'],['ㅇ','ㅎ'],['ㄹ','ㄴ']];
// 아이가 읽을 수 있는 흔한 모음끼리만 바꿔서 "그럴듯한" 글자를 만들어요
const JUNG_GROUPS=[['ㅏ','ㅑ','ㅓ','ㅕ'],['ㅗ','ㅛ','ㅜ','ㅠ'],['ㅡ','ㅣ'],
                   ['ㅐ','ㅔ'],['ㅘ','ㅚ'],['ㅝ','ㅟ']];
const JONG_EASY=['','ㄱ','ㄴ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ'];
function simList(groups,ch){
  const out=[];
  groups.forEach(g=>{ if(g.indexOf(ch)>=0) g.forEach(x=>{ if(x!==ch&&out.indexOf(x)<0) out.push(x); }); });
  return out;
}
// 답 글자를 살짝 비튼 "헷갈리는" 글자들.
// 받침만 다른 글자를 가장 먼저 쓰고(제일 배울 게 많아요), 그다음 모음, 그다음 자음.
function similarSyllables(ch){
  const d=decomp(ch); if(!d) return [];
  const byJong=[], byJung=[], byCho=[];
  JONG_EASY.forEach(j=>{ const ji=JONG.indexOf(j); if(ji!==d.jong) byJong.push(comp(d.cho,d.jung,ji)); });
  simList(JUNG_GROUPS,JUNG[d.jung]).forEach(v=>byJung.push(comp(d.cho,JUNG.indexOf(v),d.jong)));
  simList(CHO_GROUPS,CHO[d.cho]).forEach(c=>byCho.push(comp(CHO.indexOf(c),d.jung,d.jong)));
  return [shuffle(byJong),shuffle(byJung),shuffle(byCho)];
}
const JAMO_SIM={'ㄱ':['ㅋ','ㄲ','ㄴ'],'ㄴ':['ㄷ','ㄹ','ㄱ'],'ㄷ':['ㄴ','ㅌ','ㄸ'],'ㄹ':['ㄴ','ㅁ','ㄷ'],
 'ㅁ':['ㅂ','ㅇ','ㄹ'],'ㅂ':['ㅁ','ㅍ','ㅃ'],'ㅅ':['ㅈ','ㅆ','ㅊ'],'ㅇ':['ㅎ','ㅁ'],
 'ㅈ':['ㅅ','ㅊ','ㅉ'],'ㅊ':['ㅈ','ㅅ','ㅌ'],'ㅋ':['ㄱ','ㅌ'],'ㅌ':['ㄷ','ㅍ','ㅋ'],
 'ㅍ':['ㅂ','ㅌ'],'ㅎ':['ㅇ','ㅊ'],'ㄲ':['ㄱ','ㅋ'],'ㄸ':['ㄷ','ㅌ'],'ㅃ':['ㅂ','ㅍ'],
 'ㅆ':['ㅅ','ㅈ'],'ㅉ':['ㅈ','ㅊ'],
 'ㅏ':['ㅑ','ㅓ','ㅐ'],'ㅑ':['ㅏ','ㅕ'],'ㅓ':['ㅕ','ㅏ','ㅔ'],'ㅕ':['ㅓ','ㅑ'],
 'ㅗ':['ㅛ','ㅜ'],'ㅛ':['ㅗ','ㅠ'],'ㅜ':['ㅠ','ㅗ'],'ㅠ':['ㅜ','ㅛ'],
 'ㅡ':['ㅣ','ㅜ'],'ㅣ':['ㅡ','ㅓ'],'ㅐ':['ㅔ','ㅏ'],'ㅔ':['ㅐ','ㅓ'],'ㅚ':['ㅗ','ㅔ'],
 'ㅘ':['ㅗ','ㅏ'],'ㅝ':['ㅜ','ㅓ'],'ㅢ':['ㅡ','ㅣ'],
 'ㄺ':['ㄹ','ㄱ','ㄻ'],'ㄼ':['ㄹ','ㅂ','ㄺ'],'ㅄ':['ㅂ','ㅅ','ㅁ'],'ㄳ':['ㄱ','ㅅ'],
 'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄻ':['ㄹ','ㅁ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],
 'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ']};
const JAMO_POOL=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ',
                 'ㅏ','ㅓ','ㅗ','ㅜ','ㅡ','ㅣ','ㅐ','ㅔ','ㅑ','ㅕ','ㅛ','ㅠ'];

function makeDecoys(answerChars,n,jamoMode,plausible){
  const used=new Set(answerChars), out=[];
  const push=x=>{ if(x&&!used.has(x)&&out.indexOf(x)<0&&out.length<n) out.push(x); };
  if(plausible){                          // 헷갈리게 비슷한 글자 (보통 단계부터)
    if(jamoMode){
      const cand=[];
      answerChars.forEach(ch=>(JAMO_SIM[ch]||[]).forEach(s=>cand.push(s)));
      shuffle(cand).forEach(push);
    }else{
      // 받침만 다른 글자 → 모음만 다른 글자 → 자음만 다른 글자 순으로 뽑아요
      const tiers=answerChars.map(similarSyllables);
      for(let t=0;t<3;t++){
        const row=[];
        tiers.forEach(x=>{ if(x[t]) row.push(...x[t]); });
        shuffle(row).forEach(push);
      }
    }
  }
  if(out.length<n){                       // 모자라면 일반 글자로 채우기
    const filler = jamoMode ? JAMO_POOL.slice()
                            : WORDS.map(w=>w.w).join('').split('');
    shuffle(filler).forEach(push);
  }
  return out;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function fit(){
  let n=6, hmax=.155;
  if(cur){
    if(groups){ n=Math.max(6, slots.length*.8 + groups.length*.6 + 2); hmax=.115; }
    else n=Math.max(5, slots.length+2);
  }
  // 타일이 쓸데없이 여러 줄로 접히지 않도록 타일 개수도 함께 고려
  const nt=document.querySelectorAll('#tiles .tile').length;
  let byTiles=999;
  if(nt){
    const rowW=Math.min(900, window.innerWidth*0.94);
    const rows=nt<=10?1:2;
    byTiles=Math.floor(rowW/Math.ceil(nt/rows))-13;
  }
  const s=Math.max(60,Math.floor(Math.min(
    window.innerHeight*hmax, (window.innerWidth*0.86)/n, byTiles, 124)));
  document.documentElement.style.setProperty('--cs',s+'px');
}

/* ===== 한 판 시작 ===== */
function start(){
  initAudio();
  const L=LEVELS[level];
  let list=WORDS.filter(w=>w.d===L.id && (cat==='all'||w.c===cat));
  if(list.length<5) list=WORDS.filter(w=>w.d===L.id);          // 그 단계 낱말이 적으면 전체에서
  if(L.id<=2 && wantLen>0){
    const f=list.filter(w=>w.w.length===wantLen);
    if(f.length>=5) list=f;                                    // 글자 수 조건은 가능할 때만
  }
  pool=shuffle(list.slice());
  total=Math.min(wantTotal,pool.length);                       // 한 판 안에서 낱말이 겹치지 않게
  qi=0;right=0;wrong=0;
  document.getElementById('end').classList.remove('on');
  go('s-game'); nextQ();
}

function nextQ(){
  if(qi>=total){ finish(); return; }
  const L=LEVELS[level];
  qi++; answered=false; hinted=0; filled=[];
  cur=pool[qi-1];
  picShown=L.pic;

  document.getElementById('qlab').textContent=`문제 ${qi} / ${total}  ·  ${L.l}`;
  document.getElementById('fb').textContent='';
  document.getElementById('fb').className='fb';
  document.getElementById('next').classList.remove('on');
  document.getElementById('hintBtn').textContent = L.pic?'💡 힌트':'💡 그림 힌트';

  // 그림 / 문장 힌트
  const picEl=document.getElementById('pic'), senEl=document.getElementById('sentence');
  picEl.classList.toggle('q',!L.pic);
  picEl.textContent = L.pic ? cur.e : '❓';
  if(!L.pic && cur.s){
    senEl.style.display='block';
    senEl.innerHTML='💭 '+cur.s.replace('___','<b>'+'○'.repeat(cur.w.length)+'</b>');
  }else senEl.style.display='none';

  // 정답 칸 만들기
  const ans=document.getElementById('answer'), tEl=document.getElementById('tiles');
  ans.innerHTML=''; tEl.innerHTML='';
  ans.classList.toggle('jamo',L.jamo);
  tEl.classList.toggle('jamo',L.jamo);

  if(L.jamo){
    groups=splitWord(cur.w);
    slots=[];
    groups.forEach((g,gi)=>{
      g.start=slots.length;
      const box=document.createElement('div'); box.className='syl';
      const out=document.createElement('div'); out.className='sylout'; out.id='syl-'+gi; out.textContent='';
      const row=document.createElement('div'); row.className='jrow';
      g.parts.forEach(p=>{
        const d=document.createElement('div'); d.className='cell j'; d.id='cell-'+slots.length;
        row.appendChild(d); slots.push(p);
      });
      box.appendChild(out); box.appendChild(row); ans.appendChild(box);
    });
    document.getElementById('hintline').textContent=
      `자음과 모음 ${slots.length}개로 ${groups.length}글자를 만들어요!`;
  }else{
    groups=null;
    slots=cur.w.split('');
    slots.forEach((_,i)=>{
      const d=document.createElement('div'); d.className='cell'; d.id='cell-'+i;
      ans.appendChild(d);
    });
    document.getElementById('hintline').textContent =
      L.pic ? `글자 ${slots.length}개예요. 순서대로 눌러보세요!`
            : `글자 ${slots.length}개예요. 힌트를 잘 읽어 보세요!`;
  }

  // 타일 = 정답 글자 + 방해 글자
  const decoys=makeDecoys(slots,L.decoy,L.jamo,L.plausible);
  shuffle(slots.concat(decoys)).forEach(ch=>{
    const b=document.createElement('button');
    b.className='tile'; b.textContent=ch;
    b.onclick=()=>tap(b,ch);
    tEl.appendChild(b);
  });

  fit(); updateScore();
}

/* ===== 타일 놓기 ===== */
function previewOf(gi){
  const g=groups[gi], got=[];
  for(let i=0;i<g.parts.length;i++){
    const f=filled[g.start+i];
    got.push(f?f.ch:undefined);
  }
  if(got[0]===undefined) return '';
  const ci=CHO.indexOf(got[0]);
  if(got[1]===undefined) return got[0];
  const vi=JUNG.indexOf(got[1]);
  if(ci<0||vi<0) return got.filter(Boolean).join('');
  if(got.length<3||got[2]===undefined) return comp(ci,vi,0);
  const ji=JONG.indexOf(got[2]);
  return ji<0 ? comp(ci,vi,0)+got[2] : comp(ci,vi,ji);
}
function paintPreview(){
  if(!groups) return;
  groups.forEach((g,gi)=>{
    const el=document.getElementById('syl-'+gi);
    const txt=previewOf(gi);
    el.textContent=txt;
    el.classList.toggle('done', filled.length>=g.start+g.parts.length && txt===g.syl);
  });
}
function tap(btn,ch){
  if(answered||filled.length>=slots.length) return;
  initAudio();
  btn.classList.add('used');
  filled.push({ch,btn});
  const cell=document.getElementById('cell-'+(filled.length-1));
  cell.textContent=ch; cell.classList.add('filled');
  // 한 글자가 딱 완성되면 기분 좋은 짧은 소리
  let sylDone=false;
  if(groups){
    const g=groups.find(g=>g.start+g.parts.length===filled.length);
    sylDone = !!g && previewOf(groups.indexOf(g))===g.syl;
    paintPreview();
  }
  beep(sylDone?'syl':'tap');
  if(filled.length===slots.length) judge();
}
function undo(){
  if(answered||!filled.length) return;
  initAudio(); beep('tap');
  const last=filled.pop();
  last.btn.classList.remove('used');
  const cell=document.getElementById('cell-'+filled.length);
  cell.textContent=''; cell.className=groups?'cell j':'cell';
  paintPreview();
}
function judge(){
  const made=filled.map(f=>f.ch).join('');
  const want=slots.join('');
  if(made===want){
    answered=true; right++; beep('good');
    slots.forEach((_,i)=>{
      const c=document.getElementById('cell-'+i);
      c.className=(groups?'cell j ':'cell ')+'ok';
    });
    paintPreview();
    const f=document.getElementById('fb');
    f.className='fb good';
    f.textContent = hinted ? `정답! 「${cur.w}」 ${cur.e} 잘했어요!`
                           : `정답이에요! 「${cur.w}」 ${cur.e} 참 잘했어요! 🎉`;
    document.getElementById('pic').classList.remove('q');
    document.getElementById('pic').textContent=cur.e;
    speak();
    document.getElementById('next').classList.add('on');
  }else{
    beep('bad');
    slots.forEach((s,i)=>{
      const c=document.getElementById('cell-'+i);
      c.className=(groups?'cell j ':'cell ')+(filled[i].ch===s?'ok':'no');
    });
    const f=document.getElementById('fb');
    f.className='fb bad';
    f.textContent='초록 칸은 맞았어요! 빨간 칸만 다시 골라볼까요? 🤔';
    // 틀린 칸만 비워 주고 다시 도전 (게임은 끝나지 않아요)
    setTimeout(()=>{
      if(answered) return;
      for(let i=slots.length-1;i>=0;i--){
        if(filled[i] && filled[i].ch!==slots[i]){
          filled[i].btn.classList.remove('used');
          filled.splice(i,1);
        }
      }
      const keep=filled.slice(); filled=[];
      slots.forEach((_,i)=>{
        const c=document.getElementById('cell-'+i);
        c.textContent=''; c.className=groups?'cell j':'cell';
      });
      keep.forEach((k,i)=>{
        filled.push(k);
        const c=document.getElementById('cell-'+i);
        c.textContent=k.ch; c.className=(groups?'cell j ':'cell ')+'ok';
      });
      paintPreview();
    },1100);
  }
  updateScore();
}
function hint(){
  if(answered) return;
  initAudio(); beep('tap'); hinted++;
  // 그림이 숨겨진 단계에서는 첫 힌트가 그림을 보여 줘요
  if(!picShown){
    picShown=true;
    const p=document.getElementById('pic');
    p.classList.remove('q'); p.textContent=cur.e;
    document.getElementById('hintBtn').textContent='💡 힌트';
    document.getElementById('hintline').textContent='그림을 보고 다시 생각해 볼까요? 🙂';
    return;
  }
  const i=filled.length;
  if(i>=slots.length) return;
  const want=slots[i];
  document.getElementById('hintline').textContent=
    groups ? `💡 ${i+1}번째 자리에는 「${want}」 가 들어가요!`
           : `💡 ${i+1}번째 글자는 「${want}」 예요!`;
  document.querySelectorAll('.tile').forEach(t=>{
    if(t.textContent===want && !t.classList.contains('used')){
      t.style.borderColor='#facc15'; t.style.background='#fef9c3';
      setTimeout(()=>{t.style.borderColor='';t.style.background='';},1400);
    }
  });
}
function speak(){
  if(!('speechSynthesis' in window)||!cur) return;
  // 아직 못 풀었는데 어려운 단계면 정답 대신 힌트 문장을 읽어 줘요
  const text=(!answered && !LEVELS[level].pic && cur.s)
             ? cur.s.replace('___','무엇') : cur.w;
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR'; u.rate=0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function updateScore(){ document.getElementById('score').textContent=`⭕ ${right}  ❌ ${wrong}`; }

function finish(){
  beep('win'); confetti();
  document.getElementById('end-title').textContent = right===total?'전부 다 맞췄어요! 🌟':'다 풀었어요! 🎉';
  document.getElementById('end-msg').textContent=`${LEVELS[level].l} 단계에서 ${total}문제 중 ${right}낱말을 만들었어요!`;
  document.getElementById('end').classList.add('on');
}
function confetti(){
  const colors=['#fce18a','#ff726d','#b48def','#f4306d','#3fe0d0','#fde047'];
  for(let i=0;i<45;i++){
    const d=document.createElement('div');d.className='confetti';
    d.style.left=Math.random()*100+'vw';d.style.top='-14px';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    if(Math.random()>.5)d.style.borderRadius='50%';
    d.style.animationDuration=(Math.random()*2+1.3)+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),3600);
  }
}

/* 검증용 훅 */
window.getAudioState=()=>audioCtx?audioCtx.state:'none';
window.__state=()=>({level:LEVELS[level].id, word:cur&&cur.w, slots:slots.slice(),
  jamo:!!groups, tiles:document.querySelectorAll('#tiles .tile').length,
  total, qi, right, wrong, answered});
window.__solve=()=>{                       // 남은 칸을 정답 타일로 채우기
  while(!answered && filled.length<slots.length){
    const want=slots[filled.length];
    const t=[...document.querySelectorAll('#tiles .tile')]
            .find(b=>b.textContent===want && !b.classList.contains('used'));
    if(!t) return false;
    t.click();
  }
  return true;
};
fit();
