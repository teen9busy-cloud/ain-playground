<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>소싸움 대회 · 아인이의 놀이터</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐂</text></svg>">
<!-- 도트(비트맵) 한글 글꼴. 못 불러와도 아래 fallback 으로 잘 돌아갑니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
:root{
  --ink:#0d0a14; --panel:#1b1430; --panel2:#2a1f4a; --line:#5b4a8c;
  --paper:#f4ecd8; --cream:#ffe9b8;
  --gold:#ffc32b; --gold-d:#a8700a;
  --red:#e8433f;  --red-d:#8f1f1c;
  --blue:#3b7dd8; --blue-d:#1d4a8f;
  --green:#3fbf5f;--green-d:#1e7a36;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0; min-height:100vh;
  font-family:'Galmuri11','Galmuri9','DungGeunMo','Neo둥근모','Jua',
              'Apple SD Gothic Neo','Malgun Gothic',monospace;
  background:var(--ink);
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:4px 4px;
  color:var(--paper);
  overflow-x:hidden; overflow-y:auto;
  -webkit-font-smoothing:none; letter-spacing:.5px;
}
/* 경기 중에는 스크롤 없이 한 화면에 고정 */
body.fighting{overflow:hidden;height:100vh}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;letter-spacing:.5px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

.home{position:fixed;top:8px;left:8px;z-index:80;background:var(--paper);color:#3a2d1a;
  padding:0 16px;min-height:44px;display:inline-flex;align-items:center;font-size:15px;
  text-decoration:none;border:4px solid #8a7a58;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.home:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
body.fighting .home{display:none}          /* 경기 중엔 숨겨서 공간 확보 */

.screen{display:none;flex-direction:column;align-items:center;justify-content:center;
  width:100%;min-height:100vh;padding:62px 10px 24px}
.screen.on{display:flex}

/* ── 시작 ── */
h1{font-size:clamp(26px,5.2vh,50px);margin:0 0 6px;text-align:center;color:var(--gold);
  text-shadow:4px 4px 0 #7a3d05,8px 8px 0 rgba(0,0,0,.45);line-height:1.35}
.sub{font-size:clamp(15px,2.4vh,21px);color:#c3b6e6;margin:10px 0 28px;text-align:center;line-height:1.75}
.modes{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.mode{background:var(--panel2);color:var(--cream);border:4px solid var(--line);
  padding:24px 26px;width:min(310px,88vw);box-shadow:0 8px 0 rgba(0,0,0,.55);
  text-align:center;transition:.08s;min-height:186px}
.mode:active{transform:translateY(7px);box-shadow:0 1px 0 rgba(0,0,0,.55)}
.mode .em{font-size:clamp(38px,6.2vh,56px);line-height:1.15}
.mode .t{font-size:clamp(21px,3.2vh,28px);margin:12px 0 8px;color:var(--gold)}
.mode .d{font-size:clamp(14px,2vh,18px);color:#bdb0dd;line-height:1.7}
.helpbtn{margin-top:24px;background:var(--panel2);border:4px solid var(--line);color:var(--cream);
  padding:15px 30px;font-size:18px;min-height:56px;box-shadow:0 5px 0 rgba(0,0,0,.5)}
.helpbtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.5)}

/* ── 소 고르기 ── */
#s-pick{justify-content:flex-start}
.htitle{font-size:clamp(22px,3.6vh,32px);color:var(--gold);margin:0 0 8px;text-align:center;
  text-shadow:3px 3px 0 #7a3d05}
.hhint{font-size:clamp(14px,2.1vh,19px);color:#c3b6e6;margin:0 0 18px;text-align:center;line-height:1.7}
.bulls{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:13px;
  width:min(1180px,97vw)}
.bull{background:var(--panel2);border:4px solid var(--line);padding:9px 7px 11px;
  text-align:center;transition:.08s;box-shadow:0 6px 0 rgba(0,0,0,.5);color:var(--cream)}
.bull.sel{border-color:var(--gold);background:#4a2f1a;box-shadow:0 6px 0 var(--gold-d)}
.bull.taken{opacity:.3;pointer-events:none}
.bull canvas{width:100%;height:auto}
.bull .nm{font-size:clamp(17px,2.4vh,22px);margin-top:5px;color:var(--gold)}
.bull .st{display:flex;gap:5px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.pip{font-size:13px;padding:3px 7px;border:2px solid rgba(0,0,0,.35)}
.p-p{background:#5c2020;color:#ffb0b0} .p-t{background:#1f3a63;color:#a8ccff} .p-s{background:#1f4a2c;color:#a5efbb}
.bull .tag{font-size:12.5px;color:#a99cc9;margin-top:6px;line-height:1.5;min-height:36px}

.bar-row{display:flex;gap:14px;align-items:center;margin-top:20px;flex-wrap:wrap;justify-content:center}
.go{background:var(--gold);color:#3a2405;font-size:clamp(19px,2.9vh,26px);padding:17px 46px;
  min-height:64px;border:4px solid var(--gold-d);box-shadow:0 7px 0 rgba(0,0,0,.55);transition:.08s}
.go:active{transform:translateY(6px);box-shadow:0 1px 0 rgba(0,0,0,.55)}
.go:disabled{opacity:.35;transform:none;cursor:default}
.back{background:var(--panel2);border:4px solid var(--line);color:var(--cream);
  padding:15px 26px;font-size:17px;min-height:56px;box-shadow:0 5px 0 rgba(0,0,0,.5)}
.back:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.5)}

/* ── 대진표 ── */
.bracket{display:flex;gap:clamp(10px,3vw,42px);align-items:center;justify-content:center;
  margin:18px 0 24px;overflow-x:auto;max-width:98vw;padding:6px}
.rnd{display:flex;flex-direction:column;gap:9px}
.rnd .lab{font-size:14px;color:#a99cc9;text-align:center;margin-bottom:4px}
.slot{background:var(--panel2);border:4px solid var(--line);padding:10px 12px;
  min-width:clamp(96px,11vw,140px);font-size:clamp(14px,2.1vh,18px);
  text-align:center;white-space:nowrap;color:var(--cream)}
.slot.me{background:#4a2f1a;border-color:var(--gold);color:var(--gold)}
.slot.win{background:#1f4a2c;border-color:var(--green)}
.slot.now{border-color:var(--red);box-shadow:0 0 0 4px rgba(232,67,63,.35)}

/* ══════════ 경기 화면 — 스크롤 없이 한 화면 ══════════ */
#s-fight{padding:0;justify-content:flex-start}
#s-fight.on{display:flex}
.fight{width:100%;height:100vh;display:flex;flex-direction:column;gap:6px;padding:6px 8px 8px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:0 0 auto}
.topbar .rd{font-size:clamp(14px,2.2vh,20px);color:var(--gold);white-space:nowrap}
.tb-right{display:flex;gap:8px}
.icobtn{background:var(--panel2);border:3px solid var(--line);color:var(--cream);
  min-height:42px;font-size:16px;padding:0 14px;box-shadow:0 3px 0 rgba(0,0,0,.5);white-space:nowrap}
.icobtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}

.hpwrap{display:flex;gap:10px;align-items:center;flex:0 0 auto}
.hpside{flex:1;min-width:0}
.hpside .nm{font-size:clamp(14px,2vh,19px);margin-bottom:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:var(--cream)}
.hpside.r{text-align:right}
.hpbar{height:18px;background:#0a0712;border:3px solid var(--line);overflow:hidden;display:flex}
.hpfill{height:100%;transition:width .4s steps(12)}
.hpfill.me{background:linear-gradient(#5fe07f,#2f9e4d)}
.hpfill.op{background:linear-gradient(#ff6b67,#c02824);margin-left:auto}
.vs{font-size:clamp(15px,2.2vh,20px);color:var(--gold)}

/* 위: 경기장 + 해설위원 / 아래: 문제 */
.stage{flex:1 1 auto;min-height:0;max-height:44vh;display:flex;gap:8px;
  align-items:stretch;justify-content:center}
.arenabox{background:#000;border:4px solid var(--line);display:flex;
  align-items:center;justify-content:center;overflow:hidden}

.caster{background:var(--panel);border:4px solid var(--line);padding:7px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  flex:0 0 216px;width:216px;min-height:0;justify-content:flex-start}
.caster .who{font-size:14px;color:var(--gold);text-align:center;white-space:nowrap;flex:0 0 auto}
.portrait{width:min(112px,62%);flex:0 0 auto;border:3px solid #3d2f66;background:#231a3e}
.portrait canvas,.portrait img{width:100%;height:auto;display:block;image-rendering:pixelated}
.bubble{background:var(--panel2);border:3px solid var(--line);padding:9px 10px;
  font-size:clamp(14px,2vh,18px);line-height:1.6;color:var(--cream);
  width:100%;flex:1 1 auto;min-height:3.6em;overflow-y:auto;
  display:flex;align-items:flex-start}
.score{display:flex;gap:6px;width:100%;flex:0 0 auto}
.sc{flex:1;background:var(--panel2);border:3px solid var(--line);padding:4px 2px;
  text-align:center;font-size:12px;line-height:1.4;white-space:nowrap}
.sc b{display:block;font-size:18px;margin-top:2px}
.sc.o b{color:var(--green)} .sc.x b{color:var(--red)} .sc.q b{color:var(--gold)}

/* 좁거나 세로로 긴 화면: 해설위원을 경기장 아래로 */
@media (max-width:820px){
  .stage{flex-direction:column}
  .caster{flex:0 0 auto;width:100%;flex-direction:row;flex-wrap:wrap;align-items:center}
  .portrait{width:62px}
  .bubble{flex:1 1 140px;width:auto}
  .score{width:auto;flex:1 1 100%}
}

/* 문제 */
.qbox{flex:1 1 auto;min-height:0;background:var(--panel);border:4px solid var(--line);
  padding:10px 12px 12px;display:flex;flex-direction:column;justify-content:center}
.qhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.subj{background:var(--gold);color:#3a2405;padding:6px 14px;font-size:16px;border:3px solid var(--gold-d);white-space:nowrap}
.qno{font-size:15px;color:#a99cc9;white-space:nowrap}
.qtext{font-size:clamp(27px,5vh,46px);color:#fff;line-height:1.35;margin-bottom:12px;
  text-align:center;word-break:keep-all;text-shadow:3px 3px 0 rgba(0,0,0,.5);padding:4px 0}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media (max-width:700px){ .opts{grid-template-columns:repeat(2,1fr)} }
.opt{background:var(--blue);color:#fff;border:4px solid var(--blue-d);
  min-height:82px;padding:12px 10px;font-size:clamp(22px,3.8vh,34px);
  box-shadow:0 5px 0 rgba(0,0,0,.5);transition:.08s;word-break:keep-all;line-height:1.35}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.opt:disabled{cursor:default}
.opt.right{background:var(--green);border-color:var(--green-d)}
.opt.wrong{background:var(--red);border-color:var(--red-d)}
.opt.dim{opacity:.3}
.nextbtn{width:100%;margin-top:10px;background:var(--gold);color:#3a2405;
  border:4px solid var(--gold-d);min-height:68px;font-size:clamp(20px,3.1vh,28px);
  box-shadow:0 5px 0 rgba(0,0,0,.55);display:none}
.nextbtn.on{display:block}
.nextbtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.55)}

/* 화면이 낮으면 더 촘촘하게 */
@media (max-height:660px){
  .hpbar{height:14px}
  .stage{max-height:38vh}
  .opt{min-height:64px;font-size:clamp(19px,3.4vh,26px)}
  .nextbtn{min-height:56px;font-size:clamp(18px,2.9vh,23px)}
  .qtext{font-size:clamp(23px,4.4vh,32px);margin-bottom:8px}
  .subj{font-size:14px} .qno{font-size:13px}
  .caster{flex:0 0 186px;width:186px}
  .portrait{width:min(86px,54%)}
}

/* ── 팝업 ── */
.modal{display:none;position:fixed;inset:0;background:rgba(5,3,10,.88);
  align-items:safe center;justify-content:center;z-index:95;padding:20px 12px;overflow-y:auto}
.modal.on{display:flex}
.modal .m{background:var(--panel);border:5px solid var(--line);padding:22px 20px;
  text-align:center;max-width:580px;width:100%;margin:auto;box-shadow:0 10px 0 rgba(0,0,0,.6)}
.modal .em{font-size:clamp(40px,7vh,64px);line-height:1.1}
.modal h2{font-size:clamp(21px,3.5vh,31px);margin:10px 0 10px;color:var(--gold);
  text-shadow:3px 3px 0 #7a3d05;line-height:1.4}
.modal p{margin:0 0 16px;color:#cfc3ee;font-size:clamp(15px,2.2vh,19px);line-height:1.8}
.modal button{width:100%;padding:14px;min-height:60px;font-size:clamp(16px,2.4vh,21px);
  margin-top:10px;border:4px solid}
.m-go{background:var(--gold);color:#3a2405;border-color:var(--gold-d);box-shadow:0 6px 0 rgba(0,0,0,.55)}
.m-alt{background:var(--panel2);color:var(--cream);border-color:var(--line);box-shadow:0 6px 0 rgba(0,0,0,.55)}
.modal button:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.55)}
.rules{text-align:left;font-size:16px;line-height:1.85;color:#cfc3ee}
.rules .box{background:var(--panel2);border:3px solid var(--line);padding:11px 13px;margin-bottom:9px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<a class="home" href="../index.html">🏠 놀이터로</a>

<!-- ══════ 시작 ══════ -->
<div id="s-home" class="screen on">
  <h1>🐂 아인이의 소싸움 대회 🐂</h1>
  <p class="sub">진주 소싸움에 나오는 소 열네 마리가 모였어요!<br>
     문제를 맞히면 내 소가 힘차게 밀어붙입니다.</p>
  <div class="modes">
    <button class="mode" onclick="startMode('cup')">
      <div class="em">🏆</div><div class="t">천하장사 대회</div>
      <div class="d">내 소를 골라서<br>8강 · 4강 · 결승을 이겨요</div>
    </button>
    <button class="mode" onclick="startMode('duel')">
      <div class="em">⚔️</div><div class="t">1대1 대결</div>
      <div class="d">소 두 마리를 직접 골라<br>바로 붙여 봐요</div>
    </button>
  </div>
  <button class="helpbtn" onclick="showRules()">📖 어떻게 하는 거예요?</button>
</div>

<!-- ══════ 소 고르기 ══════ -->
<div id="s-pick" class="screen">
  <div class="htitle" id="pick-title">내 소를 골라 주세요</div>
  <p class="hhint" id="pick-hint">💪 힘 · 🌀 기술 · 🔥 끈기 를 보고 골라 보세요</p>
  <div class="bulls" id="bulls"></div>
  <div class="bar-row">
    <button class="back" onclick="go('s-home')">◀ 뒤로</button>
    <button class="go" id="pick-go" onclick="confirmPick()" disabled>정했어요!</button>
  </div>
</div>

<!-- ══════ 대진표 ══════ -->
<div id="s-bracket" class="screen">
  <div class="htitle" id="br-title">천하장사 대회 대진표</div>
  <div class="bracket" id="bracket"></div>
  <button class="go" id="br-go" onclick="beginMatch()">경기 시작!</button>
</div>

<!-- ══════ 경기 ══════ -->
<div id="s-fight" class="screen">
 <div class="fight">
  <div class="topbar">
    <span class="rd" id="round-lab">8강</span>
    <div class="tb-right">
      <button class="icobtn" id="voice-btn" onclick="toggleVoice()">🗣</button>
      <button class="icobtn" id="bgm-btn" onclick="toggleBGM()">🔊</button>
      <button class="icobtn" onclick="quitFight()">그만두기</button>
    </div>
  </div>

  <div class="hpwrap">
    <div class="hpside">
      <div class="nm" id="me-name">불검</div>
      <div class="hpbar"><div class="hpfill me" id="me-hp" style="width:100%"></div></div>
    </div>
    <span class="vs">VS</span>
    <div class="hpside r">
      <div class="nm" id="op-name">흑곰</div>
      <div class="hpbar"><div class="hpfill op" id="op-hp" style="width:100%"></div></div>
    </div>
  </div>

  <div class="stage">
    <div class="arenabox"><canvas id="arena" width="420" height="230"></canvas></div>
    <div class="caster">
      <div class="who" id="caster-name">🎙 해설위원</div>
      <div class="portrait" id="portrait"><canvas id="caster-cv" width="96" height="120"></canvas></div>
      <div class="bubble" id="say">자, 이제 시작해 보입시더!</div>
      <div class="score">
        <div class="sc q">문제<b id="sc-q">1/10</b></div>
        <div class="sc o">맞음<b id="sc-o">0</b></div>
        <div class="sc x">틀림<b id="sc-x">0</b></div>
      </div>
    </div>
  </div>

  <div class="qbox">
    <div class="qhead">
      <span class="subj" id="subj">🔢 산수</span>
      <span class="qno" id="qno">1번 문제</span>
    </div>
    <div class="qtext" id="qtext">7 + 5 = ?</div>
    <div class="opts" id="opts"></div>
    <button class="nextbtn" id="nextbtn" onclick="nextQuestion()">▶ 다음 문제</button>
  </div>
 </div>
</div>

<div class="modal" id="modal"><div class="m" id="modal-box"></div></div>

<script>
"use strict";

/* ╔════════════════════════════════════════════════════════════════╗
   ║ 해설위원 설정 — 이 두 줄만 바꾸면 됩니다                        ║
   ║                                                                ║
   ║ • 이름을 바꾸려면 CASTER_NAME 을 고치세요.                       ║
   ║ • 사진을 넣으려면 games 폴더에 caster.png 를 넣으세요.           ║
   ║   (caster.jpg / caster.jpeg / caster.webp 도 됩니다)            ║
   ║   사진이 있으면 자동으로 도트 캐릭터 대신 사진이 나옵니다.        ║
   ╚════════════════════════════════════════════════════════════════╝ */
const CASTER_NAME  = '강동길 해설위원';
const CASTER_PHOTO = ['caster.png','caster.jpg','caster.jpeg','caster.webp'];

/* ══════════════ 소 데이터 ══════════════ */
const BULLS=[
 {n:'불검',    c:'red',   p:5,t:3,s:3, tag:'불처럼 달려드는 힘'},
 {n:'화랑',    c:'brown', p:4,t:4,s:4, tag:'빈틈 없는 균형'},
 {n:'용암산',  c:'dark',  p:5,t:2,s:5, tag:'산처럼 버티는 거구'},
 {n:'빙점',    c:'white', p:3,t:5,s:3, tag:'차가운 기술의 달인'},
 {n:'금삼',    c:'gold',  p:4,t:4,s:3, tag:'황금빛 뿔의 주인'},
 {n:'흑기사',  c:'black', p:4,t:5,s:3, tag:'검은 갑옷의 기사'},
 {n:'태검',    c:'brown', p:5,t:3,s:2, tag:'큰 뿔로 한 방'},
 {n:'장검',    c:'gray',  p:3,t:5,s:4, tag:'길고 날카로운 뿔'},
 {n:'흑마',    c:'black', p:3,t:4,s:5, tag:'지치지 않는 다리'},
 {n:'흑곰',    c:'black', p:5,t:2,s:5, tag:'곰처럼 육중한 몸'},

/* 산수 문제는 그때그때 새로 만들어 냅니다 (매번 다른 문제) */
function makeMath(step){
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const kinds = step<=3 ? ['add','sub','cnt'] : (step<=6 ? ['add','sub','mul','cmp'] : ['add','sub','mul','cmp','odd','ten']);
  const k = pick(kinds);
  let q,ans;
  if(k==='add'){ const a=R(2,step<=3?9:18), b=R(2,step<=3?9:18); q=`${a} + ${b} = ?`; ans=a+b; }
  else if(k==='sub'){ const a=R(5,step<=3?12:25), b=R(1,a-1); q=`${a} - ${b} = ?`; ans=a-b; }
  else if(k==='mul'){ const a=R(2,9), b=R(2,9); q=`${a} × ${b} = ?`; ans=a*b; }
  else if(k==='cnt'){ const a=R(3,9); q=`🐮 가 ${a}마리 있고 ${R(1,3)}마리가 더 왔어요. 모두 몇 마리?`;
                      const add=parseInt(q.match(/(\d+)마리가 더/)[1],10); ans=a+add; }
  else if(k==='cmp'){ const a=R(11,60), b=R(11,60); if(a===b) return makeMath(step);
                      q=`${a} 와 ${b} 중에서 더 큰 수는?`; ans=Math.max(a,b); }
  else if(k==='odd'){ const a=R(2,30); q=`${a} 은(는) 짝수일까요 홀수일까요?`;
                      return ['math',q,shuffleAns(a%2===0?'짝수':'홀수',[a%2===0?'홀수':'짝수','둘 다','알 수 없다'])]; }
  else { const a=R(1,9); q=`${a} + ? = 10`; ans=10-a; }

  // 그럴듯한 오답 3개
  const wrong=new Set();
  let guard=0;
  while(wrong.size<3 && guard++<60){
    const d=pick([-3,-2,-1,1,2,3,10,-10,5,-5]);
    const w=ans+d;
    if(w!==ans && w>=0) wrong.add(w);
  }
  while(wrong.size<3) wrong.add(ans+wrong.size+1);
  return ['math',q,shuffleAns(String(ans),[...wrong].map(String))];
}
/* 정답과 오답을 섞어 [보기배열, 정답인덱스] 형태로 */
function shuffleAns(right,wrongs){
  const arr=[right,...wrongs.slice(0,3)];
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return [arr, arr.indexOf(right)];
}

/* 한 경기에 낼 10문제 뽑기 — 과목을 골고루 */
function buildQuiz(){
  const plan=['math','kor','eng','hanja','math','manner','idea','eng','cow','math'];
  for(let i=plan.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[plan[i],plan[j]]=[plan[j],plan[i]];}
  const used=new Set(), out=[];
  plan.forEach((subj,i)=>{
    if(subj==='math'){
      let m, guard=0;
      do{ m=makeMath(i+1); }while(used.has(m[1]) && guard++<40);   // 같은 식 두 번 방지
      used.add(m[1]);
      out.push({s:'math',q:m[1],o:m[2][0],c:m[2][1]}); return;
    }
    const pool=BANK.filter(b=>b[0]===subj && !used.has(b[1]));
    const b = pool.length ? pick(pool) : pick(BANK.filter(x=>!used.has(x[1])));
    used.add(b[1]);
    const [opts,ci]=shuffleAns(b[2][b[3]], b[2].filter((_,k)=>k!==b[3]));
    out.push({s:b[0],q:b[1],o:opts,c:ci});
  });
  return out;
}

  if(AC.state==='suspended') AC.resume(); }catch(e){} }
function tone(freq,dur,type,vol,when){
  if(!AC||!freq)return;
  try{
    const t=(when||AC.currentTime);
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.08,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
function noise(dur,vol){
  if(!AC)return;
  try{
    const t=AC.currentTime, n=Math.floor(AC.sampleRate*dur);
    const buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=AC.createBufferSource(); src.buffer=buf;
    const g=AC.createGain(); g.gain.setValueAtTime(vol||.12,t);
    src.connect(g); g.connect(AC.destination); src.start(t);
  }catch(e){}
}
/* 잡음을 필터에 통과시켜 '딱' '푹' '와아아' 같은 소리를 만든다 */
function band(dur,type,freq,vol,when,swell){
  if(!AC) return;
  try{
    const t=when||AC.currentTime, n=Math.max(1,Math.floor(AC.sampleRate*dur));
    const buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(); src.buffer=buf;
    const f=AC.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t);
    if(type==='bandpass') f.Q.setValueAtTime(.8,t);
    const g=AC.createGain();
    if(swell){                                   // 관중 함성: 서서히 커졌다 작아짐
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(vol,t+dur*0.28);
      g.gain.setValueAtTime(vol,t+dur*0.5);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      f.frequency.linearRampToValueAtTime(freq*1.5,t+dur*0.4);
    }else{
      g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    }
    src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
  }catch(e){}
}

const VOICE_DIR='voice/';
const VOICE_SETS={start:2,right:5,crit:3,wrong:5,tank:2,win:2,lose:2};
const voiceCache={};                       // 'right1' → Audio | false(없음) | null(확인중)
let voiceOn=true, koVoice=null;

function primeVoice(kind){                 // 파일이 있는지 미리 살짝 확인
  const n=VOICE_SETS[kind]||0;
  for(let i=1;i<=n;i++){
    const k=kind+i;
    if(voiceCache[k]!==undefined) continue;
    voiceCache[k]=null;
    const a=new Audio(VOICE_DIR+k+'.m4a');
    a.preload='auto';
    a.oncanplaythrough=()=>{ voiceCache[k]=a; };
    a.onerror=()=>{ voiceCache[k]=false; };
    try{ a.load(); }catch(e){ voiceCache[k]=false; }
    return;                                // 한 번에 하나씩만 (요청 폭주 방지)
  }
}
function playVoiceFile(kind){
  const n=VOICE_SETS[kind]||0, ready=[];
  for(let i=1;i<=n;i++){ const v=voiceCache[kind+i]; if(v && v!==true) ready.push(v); }
  primeVoice(kind);
  if(!ready.length) return false;
  const a=pick(ready);
  try{ a.currentTime=0; const pr=a.play(); if(pr&&pr.catch) pr.catch(()=>{}); return true; }
  catch(e){ return false; }
}
function pickKoVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices()||[];
  koVoice = vs.find(v=>/^ko/i.test(v.lang)) || vs.find(v=>/korean|한국/i.test(v.name)) || null;
}
if('speechSynthesis' in window){
  pickKoVoice();
  speechSynthesis.onvoiceschanged=pickKoVoice;
}
function speakLine(text){
  if(!('speechSynthesis' in window)) return false;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR'; u.rate=1.12; u.pitch=1.15; u.volume=1;
    if(koVoice) u.voice=koVoice;
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}
/* 부딪히는 소리가 잦아든 뒤에 해설이 터진다 */
function callOut(kind,text,delay){
  if(!voiceOn) return;
  setTimeout(()=>{
    if(!voiceOn) return;
    if(playVoiceFile(kind)) return;       // 녹음 파일이 있으면 그것으로
    speakLine(text);                      // 없으면 브라우저가 읽어 줌
  }, delay||0);
}
function stopVoice(){ if('speechSynthesis' in window){ try{speechSynthesis.cancel();}catch(e){} } }
function toggleVoice(){
  voiceOn=!voiceOn;
  document.getElementById('voice-btn').textContent = voiceOn?'🗣':'🤐';
  if(!voiceOn && 'speechSynthesis' in window){ try{speechSynthesis.cancel();}catch(e){} }
  if(voiceOn) ['right','wrong'].forEach(primeVoice);
}
function toggleBGM(){
  initAudio(); bgmOn=!bgmOn;

}

/* ══════════════ 경기장 ══════════════ */
const arena=document.getElementById('arena');
const A=arena.getContext('2d');
const AW=420, AH=230;
let scene='wide';
let fx={t:0, shake:0, flash:0, cu:null, meLean:0, opLean:0};
let rafId=null;

const CROWD=(()=>{
  let sd=20260822; const rnd=()=>{sd=(sd*1103515245+12345)&0x7fffffff;return sd/0x7fffffff;};
  const cols=['#c9a06a','#a87c50','#e0c49a','#8a6440','#f0dcbb','#7a5638'];
  const a=[];
  for(let r=0;r<2;r++) for(let i=0;i<32;i++)
    a.push({x:i*13+(r%2)*6+Math.floor(rnd()*3), y:4+r*13, c:cols[Math.floor(rnd()*cols.length)]});
  return a;
})();

function drawWide(){
  px(A,0,0,AW,AH,'#2a1c10');
  CROWD.forEach(c=>{ px(A,c.x,c.y,7,7,c.c); px(A,c.x-1,c.y+7,9,5,'#3d2c1c'); });
  px(A,0,30,AW,14,'#8c2f2f'); px(A,0,30,AW,3,'#b04242');
  A.fillStyle='#ffe9b8'; A.textAlign='center'; A.textBaseline='middle';
  A.font="10px 'Galmuri11','DungGeunMo','Jua',monospace";
  A.fillText('아인이배 천하장사 소싸움 대회', AW/2, 37);

  px(A,0,44,AW,AH-44,'#cba173'); px(A,0,44,AW,4,'#a8804f');
  for(let i=0;i<20;i++) px(A,(i*43)%410, 62+((i*61)%140), 11, 3, '#bb9366');

  /* 중앙선 — 누가 밀리고 있는지 한눈에 */
  for(let y=56;y<AH;y+=10) px(A,AW/2-1,y,3,6,'rgba(255,255,255,.22)');

  /* 기력이 적은 쪽이 중앙에서 밀려난다 */
  const diff = me&&op ? (op.hp-me.hp)/HPMAX : 0;        // >0 이면 내가 밀리는 중
  const clash = AW/2 - diff*46;
  const sc=1.75, half=54*sc;
  const bob = Math.floor(fx.t*3)%2 ? -1 : 0;
  const baseY=168;

  if(op) drawBullPx(A,{x:clash+half,y:baseY,sc:sc,dir:-1,hide:op.b.c,name:op.b.n,
                        bob:bob, lean:fx.opLean});
  if(me) drawBullPx(A,{x:clash-half,y:baseY,sc:sc,dir: 1,hide:me.b.c,name:me.b.n,
                        bob:-bob,lean:fx.meLean});

  /* 밀리는 쪽 표시 */
  if(me&&op&&Math.abs(diff)>0.12){
    A.font="11px 'Galmuri11','DungGeunMo','Jua',monospace";
    A.textAlign='center'; A.textBaseline='middle';
    const losing = diff>0 ? me.b.n : op.b.n;
    const lx = diff>0 ? clash-half : clash+half;
    A.fillStyle='#0d0a14'; A.fillText('▼ 밀리는 중',lx+1,57);
    A.fillStyle='#ff8f8b'; A.fillText('▼ 밀리는 중',lx,56);
  }
}

const TECHS={ head:{n:'박치기',cry:'쿵!!'}, push:{n:'밀치기',cry:'우으윽!!'}, horn:{n:'뿔치기',cry:'빠악!!'} };

function drawCloseup(){
  const cu=fx.cu; if(!cu) return;
  const p=Math.min(1,(fx.t-cu.t0)/cu.dur);

  px(A,0,0,AW,AH,'#3a2412');
  for(let i=0;i<AH;i+=6) px(A,0,i,AW,3,'#412a15');
  for(let i=0;i<14;i++){ const yy=(i*17+Math.floor(fx.t*70)%17)%172; px(A,0,yy,AW,2,'rgba(255,255,255,.055)'); }
  px(A,0,172,AW,AH-172,'#cba173'); px(A,0,172,AW,4,'#a8804f');

  const sc=1.28, CY=112, MID=AW/2;
  const contact=88*sc, rest=contact+44;
  let gap;
  if(p<0.24)      gap = rest-(rest-contact)*(p/0.24);
  else if(p<0.36) gap = contact+(p-0.24)/0.12*10;
  else            gap = contact+7;
  let slide=0;
  if(cu.tech==='push' && p>0.32) slide=(p-0.32)/0.68*52;
  if(cu.tech==='head' && p>0.32) slide=(p-0.32)/0.68*15;

  const d=cu.mine?1:-1;
  const ax=MID-d*gap/2+d*slide, dx=MID+d*gap/2+d*slide, cx=(ax+dx)/2;
  const tilt=(cu.tech==='horn'&&p>0.24)?Math.sin((p-0.24)*40)*4:0;

  drawHeadPx(A,{x:dx,y:CY+tilt,sc:sc,dir:-d,hide:cu.def.b.c});
  drawHeadPx(A,{x:ax,y:CY-tilt,sc:sc,dir: d,hide:cu.atk.b.c});

  if(p>=0.24){
    const q=(p-0.24)/0.76;
    if(cu.tech==='horn'){
      for(let i=0;i<12;i++){ const a=i*30+q*140, r=13+q*58;
        px(A,cx+Math.cos(a*Math.PI/180)*r-3, CY-22+Math.sin(a*Math.PI/180)*r*.7-3,7,7,i%2?'#fff8c8':'#ffc32b'); }
    }else if(cu.tech==='head'){
      A.strokeStyle='rgba(255,255,255,'+Math.max(0,1-q*1.3)+')'; A.lineWidth=4;
      [22,44,70].forEach(r0=>{ A.beginPath(); A.arc(cx,CY,r0*(0.5+q*1.1),0,Math.PI*2); A.stroke(); });
      for(let i=0;i<8;i++){ const a=i*45+q*30, r=18+q*70;
        px(A,cx+Math.cos(a*Math.PI/180)*r-4, CY+Math.sin(a*Math.PI/180)*r*.75-4,9,9,'#ffe066'); }
    }else{
      for(let i=0;i<16;i++){ const a=(i*41)%180, r=q*(20+(i%6)*17);
        px(A, dx+d*(16+Math.cos(a*Math.PI/180)*r), 176-Math.abs(Math.sin(a*Math.PI/180))*r*.55,
              10-((i%3)*3),8, i%2?'#e0c49a':'#c9a675'); }
    }
    if(p<0.86){
      const t=TECHS[cu.tech].cry;
      A.font="bold 34px 'Galmuri11','DungGeunMo','Jua',monospace";
      A.textAlign='center'; A.textBaseline='middle';
      const yy=34-q*6, wob=Math.sin(q*30)*2;
      A.fillStyle='#000'; A.fillText(t,cx+3,yy+3);
      A.fillStyle=cu.crit?'#ff6b67':'#ffc32b'; A.fillText(t,cx+wob,yy);
    }
  }
  px(A,0,AH-24,AW,24,'rgba(10,7,18,.88)'); px(A,0,AH-24,AW,3,'#5b4a8c');
  A.fillStyle='#ffe9b8'; A.textAlign='center'; A.textBaseline='middle';
  A.font="13px 'Galmuri11','DungGeunMo','Jua',monospace";
  A.fillText(`${cu.atk.b.n} 의 ${TECHS[cu.tech].n}!${cu.crit?'  회심의 일격!!':''}`, AW/2, AH-11);
}

function loop(){
  fx.t+=1/60;
  A.save();
  if(fx.shake>0.4){ A.translate((Math.random()-.5)*fx.shake,(Math.random()-.5)*fx.shake); fx.shake*=0.90; }
  scene==='wide'? drawWide() : drawCloseup();
  A.restore();
  if(fx.flash>0){ px(A,0,0,AW,AH,`rgba(255,255,255,${fx.flash})`); fx.flash-=0.05; }
  fx.meLean*=0.90; fx.opLean*=0.90;
  drawCaster(casterMood);
  rafId=requestAnimationFrame(loop);
}

/* 남는 공간에 경기장을 딱 맞춘다 (스크롤 없이) */
function fitFight(){
  const stage=document.querySelector('.stage'), box=document.querySelector('.arenabox');
  if(!stage||!box||!document.getElementById('s-fight').classList.contains('on')) return;
  const wide = window.innerWidth>=821;
  const h = (wide ? stage.clientHeight : stage.clientHeight - box.nextElementSibling.offsetHeight - 8) - 8;
  const w = (wide ? stage.clientWidth - box.nextElementSibling.offsetWidth - 8 : stage.clientWidth) - 8;
  const cw = Math.max(150, Math.min(w, h*AW/AH));
  arena.style.width  = Math.floor(cw)+'px';
  arena.style.height = Math.floor(cw*AH/AW)+'px';
}
window.addEventListener('resize',()=>{ fitFight(); });

/* ══════════════ 화면 전환 ══════════════ */
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.body.classList.toggle('fighting', id==='s-fight');
  window.scrollTo(0,0);
  if(id==='s-fight'){ requestAnimationFrame(()=>{ fitFight(); requestAnimationFrame(fitFight); });
                      if(!rafId) loop(); }
  else if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
function showModal(html){ document.getElementById('modal-box').innerHTML=html;
                          document.getElementById('modal').classList.add('on'); }

/* ══════════════ 소 고르기 ══════════════ */
function startMode(m){
  initAudio(); SFX.tap(); bgmStart();
  mode=m; pickStage=0; myBull=null; opBull=null;
  buildPickList(); go('s-pick');
}
function buildPickList(){
  const box=document.getElementById('bulls'); box.innerHTML='';
  const second=(mode==='duel'&&pickStage===1);
  document.getElementById('pick-title').textContent=second?'상대 소를 골라 주세요':'내 소를 골라 주세요';
  document.getElementById('pick-hint').innerHTML=second
    ? `내 소는 <span style="color:var(--gold)">${myBull.n}</span> 입니다. 붙여 볼 상대를 고르세요!`
    : '💪 힘 · 🌀 기술 · 🔥 끈기 를 보고 골라 보세요';
  const goBtn=document.getElementById('pick-go'); goBtn.disabled=true;
  BULLS.forEach((b,i)=>{
    const btn=document.createElement('button');
    btn.className='bull';
    if(second&&myBull&&b.n===myBull.n) btn.classList.add('taken');
    btn.innerHTML=`<canvas width="150" height="86"></canvas><div class="nm">${b.n}</div>
      <div class="st"><span class="pip p-p">💪${b.p}</span><span class="pip p-t">🌀${b.t}</span><span class="pip p-s">🔥${b.s}</span></div>
      <div class="tag">${b.tag}</div>`;
    btn.onclick=()=>{ initAudio(); SFX.tap();
      document.querySelectorAll('.bull').forEach(x=>x.classList.remove('sel'));
      btn.classList.add('sel'); goBtn.disabled=false; goBtn.dataset.i=i; };
    box.appendChild(btn);
    drawBullPx(btn.querySelector('canvas').getContext('2d'),
               {x:70,y:58,sc:1.1,dir:1,hide:b.c,name:b.n});
  });
}
function confirmPick(){
  const i=parseInt(document.getElementById('pick-go').dataset.i,10);
  initAudio(); SFX.tap();
  if(mode==='duel'&&pickStage===0){ myBull=BULLS[i]; pickStage=1; buildPickList(); window.scrollTo(0,0); return; }
  if(mode==='duel'){ opBull=BULLS[i]; startDuel(); return; }
  myBull=BULLS[i]; makeBracket(); go('s-bracket');
}

/* ══════════════ 대진표 ══════════════ */
const ROUND_NAME=['8강','4강','결승'];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeBracket(){
  const rest=shuffle(BULLS.filter(b=>b.n!==myBull.n)).slice(0,7);
  bracket={r8:shuffle([myBull].concat(rest)),r4:[null,null,null,null],r2:[null,null],champ:null};
  roundIdx=0; renderBracket();
}
const myIdx=list=>list.findIndex(b=>b&&b.n===myBull.n);
function renderBracket(){
  const el=document.getElementById('bracket'); el.innerHTML='';
  [['8강',bracket.r8],['4강',bracket.r4],['결승',bracket.r2],['천하장사',[bracket.champ]]]
  .forEach(([lab,list],ci)=>{
    const d=document.createElement('div'); d.className='rnd';
    d.innerHTML=`<div class="lab">${lab}</div>`;
    list.forEach((b,bi)=>{
      const s=document.createElement('div'); s.className='slot'; s.textContent=b?b.n:'?';
      if(b&&b.n===myBull.n) s.classList.add('me');
      if(ci===roundIdx){ const m=myIdx(list); if(m>=0&&(bi===m||bi===(m^1))) s.classList.add('now'); }
      if(ci<roundIdx&&b) s.classList.add('win');
      d.appendChild(s);
    });
    el.appendChild(d);
  });
  const cur=[bracket.r8,bracket.r4,bracket.r2][roundIdx];
  const foe=cur[myIdx(cur)^1];
  document.getElementById('br-title').innerHTML = bracket.champ
    ? `🏆 ${bracket.champ.n} 천하장사 등극!`
    : `${ROUND_NAME[roundIdx]} · <span style="color:var(--gold)">${myBull.n}</span> vs <span style="color:#ff8f8b">${foe?foe.n:'?'}</span>`;
  document.getElementById('br-go').style.display = bracket.champ?'none':'inline-block';
}

/* ══════════════ 경기 ══════════════ */
const mkFighter=b=>({b,hp:HPMAX});
function startDuel(){ me=mkFighter(myBull); op=mkFighter(opBull); setupFight('1대1 대결'); }
function beginMatch(){
  const cur=[bracket.r8,bracket.r4,bracket.r2][roundIdx], m=myIdx(cur);
  me=mkFighter(cur[m]); op=mkFighter(cur[m^1]);
  setupFight(ROUND_NAME[roundIdx]);
}
function setupFight(label){
  initAudio(); bgmStart();
  quiz=buildQuiz(); qi=0; right=0; wrong=0; locked=false;
  scene='wide'; fx.cu=null; fx.meLean=0; fx.opLean=0; casterMood='normal';
  document.getElementById('caster-name').textContent='🎙 '+CASTER_NAME;
  document.getElementById('round-lab').textContent=label;
  document.getElementById('me-name').textContent=me.b.n;
  document.getElementById('op-name').textContent=op.b.n;
  document.getElementById('bgm-btn').textContent=bgmOn?'🔊':'🔇';
  updateHP(); updateScore(); go('s-fight');
  document.getElementById('voice-btn').textContent = voiceOn?'🗣':'🤐';
  ['right','wrong','crit'].forEach(primeVoice);
  const opening=pick(SAY_START);
  say(opening,()=>askQuestion());
  callOut('start',opening,250);
}
function updateHP(){
  document.getElementById('me-hp').style.width=Math.max(0,me.hp/HPMAX*100)+'%';
  document.getElementById('op-hp').style.width=Math.max(0,op.hp/HPMAX*100)+'%';
}
function updateScore(){
  document.getElementById('sc-q').textContent=Math.min(qi+1,MAXQ)+'/'+MAXQ;
  document.getElementById('sc-o').textContent=right;
  document.getElementById('sc-x').textContent=wrong;
}

let typeTimer=null;
function say(text,done){
  const el=document.getElementById('say');
  if(typeTimer) clearInterval(typeTimer);
  let i=0; el.textContent='';
  typeTimer=setInterval(()=>{
    el.textContent=text.slice(0,++i);
    if(i>=text.length){ clearInterval(typeTimer); typeTimer=null; if(done) done(); }
  },26);
}

function askQuestion(){
  const q=quiz[qi];
  casterMood='normal';
  document.getElementById('subj').textContent=SUBJ[q.s];
  document.getElementById('qno').textContent=(qi+1)+'번 문제';
  document.getElementById('qtext').textContent=q.q;
  document.getElementById('nextbtn').classList.remove('on');
  updateScore();
  const box=document.getElementById('opts'); box.innerHTML='';
  q.o.forEach((txt,k)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=txt; b.dataset.k=k;
    b.onclick=()=>answer(k);
    box.appendChild(b);
  });
  locked=false;
  fitFight();
  say(pick(SAY_ASK).replace('{n}',qi+1));
}

function answer(k){
  if(locked) return;
  locked=true; initAudio();
  const q=quiz[qi], ok=(k===q.c);
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    const bk=parseInt(b.dataset.k,10);
    if(bk===q.c) b.classList.add('right');
    else if(bk===k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  ok? (right++, SFX.right()) : (wrong++, SFX.wrong());
  updateScore();
  setTimeout(()=>doAttack(ok),640);
}

function doAttack(iAttack){
  const atk=iAttack?me:op, def=iAttack?op:me;
  const crit=Math.random()<atk.b.p*0.06;
  const tank=!crit && Math.random()<def.b.s*0.05;
  const tech=pick(['head','push','horn']);
  const dmg = crit? Math.round(DMG*2) : (tank? Math.round(DMG*0.5) : DMG);

  scene='closeup';
  fx.cu={t0:fx.t,dur:1.45,atk,def,tech,crit,mine:iAttack};
  fx.shake=crit?16:9; fx.flash=crit?.55:.3;
  setTimeout(()=>{ crit?SFX.crit():SFX.hit(); },380);      // ① 소가 부딪히는 소리
  setTimeout(()=>SFX.crowd(crit||iAttack),  520);          // ② 관중 함성

  casterMood=iAttack?'excited':'sad';
  const kind = crit? 'crit' : (iAttack? 'right' : (tank? 'tank' : 'wrong'));
  const line = crit? pick(SAY_CRIT) : (iAttack? pick(SAY_RIGHT) : (tank? pick(SAY_TANK) : pick(SAY_WRONG)));
  setTimeout(()=>say(line),420);
  callOut(kind, line, 900);                                // ③ 해설 음성
  setTimeout(()=>{ def.hp=Math.max(0,def.hp-dmg); updateHP(); },700);
  setTimeout(()=>{
    scene='wide'; fx.cu=null;
    if(iAttack){ fx.meLean=12; fx.opLean=8; } else { fx.meLean=-8; fx.opLean=-12; }
    afterAttack();
  },1560);
}
function afterAttack(){
  if(op.hp<=0||me.hp<=0||wrong>=LOSE_WRONG||qi>=MAXQ-1){ setTimeout(endFight,520); return; }
  document.getElementById('nextbtn').classList.add('on');
  fitFight();
}
function nextQuestion(){
  initAudio(); SFX.tap(); qi++;
  if(qi>=MAXQ){ endFight(); return; }
  askQuestion();
}

/* ══════════════ 종료 ══════════════ */
function endFight(){
  const iWon = op.hp<=0 ? true
             : (me.hp<=0||wrong>=LOSE_WRONG) ? false
             : (right>wrong ? true : (me.hp>=op.hp && right>=wrong));
  casterMood=iWon?'excited':'sad';
  const endLine=pick(iWon?SAY_WIN:SAY_LOSE);
  say(endLine);
  iWon? SFX.win() : SFX.lose();
  if(iWon) SFX.crowd(true);
  callOut(iWon?'win':'lose', endLine, 700);
  document.getElementById('nextbtn').classList.remove('on');
  const stat=`10문제 중 <span style="color:var(--green)">${right}문제</span>를 맞혔어요.`;
  setTimeout(()=>{
    if(mode==='duel'){ duelEnd(iWon,stat); return; }
    iWon? cupWin(stat) : cupLose(stat);
  },1100);
}
function duelEnd(iWon,stat){
  const w=iWon?me.b:op.b, l=iWon?op.b:me.b;
  showModal(`<div class="em">${iWon?'🏆':'😤'}</div><h2>${w.n} 승리!</h2>
    <p>${w.n} 가 ${l.n} 를 이겼습니다.<br>${stat}</p>
    <button class="m-go" onclick="closeModal();startDuel()">같은 소로 한 판 더!</button>
    <button class="m-alt" onclick="closeModal();startMode('duel')">다른 소 골라서 하기</button>
    <button class="m-alt" onclick="closeModal();go('s-home')">처음으로</button>`);
}
function cupWin(stat){
  const cur=[bracket.r8,bracket.r4,bracket.r2][roundIdx];
  const next=[bracket.r4,bracket.r2,null][roundIdx];
  const m=myIdx(cur);
  if(roundIdx<2){
    next[Math.floor(m/2)]=me.b;
    for(let i=0;i<cur.length;i+=2){
      if(i===m||i===(m^1)) continue;
      const a=cur[i], b=cur[i+1]; if(!a||!b) continue;
      next[i/2]=(a.p+a.t+a.s+Math.random()*5)>=(b.p+b.t+b.s+Math.random()*5)?a:b;
    }
    const doneRound=ROUND_NAME[roundIdx];
    roundIdx++; renderBracket();
    const nc=[bracket.r8,bracket.r4,bracket.r2][roundIdx];
    const foe=nc[myIdx(nc)^1];
    showModal(`<div class="em">🎉</div><h2>${doneRound} 통과!</h2>
      <p><span style="color:var(--gold)">${me.b.n}</span> 가 ${op.b.n} 를 이겼습니다.<br>${stat}
      <br><br>다음은 <span style="color:var(--gold)">${ROUND_NAME[roundIdx]}</span>,
      상대는 <span style="color:#ff8f8b">${foe?foe.n:'?'}</span> 입니다!</p>
      <button class="m-go" onclick="closeModal();beginMatch()">바로 다음 경기!</button>
      <button class="m-alt" onclick="closeModal();go('s-bracket')">대진표 보기</button>`);
  }else{
    bracket.champ=me.b; renderBracket();
    showModal(`<div class="em">🏆👑</div><h2>${me.b.n} 천하장사!</h2>
      <p>8강, 4강, 결승을 모두 이겼습니다.<br>${stat}<br>
      아인이와 ${me.b.n} 가 대회 우승입니다. 박수 한번 주이소!!</p>
      <button class="m-go" onclick="closeModal();startMode('cup')">다른 소로 또 도전!</button>
      <button class="m-alt" onclick="closeModal();go('s-home')">처음으로</button>`);
  }
}
function cupLose(stat){
  showModal(`<div class="em">😢</div><h2>${ROUND_NAME[roundIdx]}에서 아쉽게…</h2>
    <p>${stat}<br>다음엔 더 잘할 수 있어요!<br>한 번 더 붙어 볼까요?</p>
    <button class="m-go" onclick="closeModal();beginMatch()">이 경기 다시 하기</button>
    <button class="m-alt" onclick="closeModal();startMode('cup')">소 다시 고르기</button>
    <button class="m-alt" onclick="closeModal();go('s-home')">처음으로</button>`);
}
function quitFight(){
  showModal(`<div class="em">🐂</div><h2>경기를 그만할까요?</h2>
    <p>지금까지의 경기 기록은 사라집니다.</p>
    <button class="m-go" onclick="closeModal()">계속 할래요</button>
    <button class="m-alt" onclick="closeModal();bgmStop();stopVoice();go('s-home')">그만하기</button>`);
}

/* ══════════════ 규칙 ══════════════ */

  showModal(`<div class="em">📖</div><h2>어떻게 하는 거예요?</h2>
    <div class="rules">
      <div class="box">① 내 소를 고르고 경기장에 들어갑니다.</div>
      <div class="box">② ${CASTER_NAME}가 문제를 냅니다.<br>
        산수 · 국어 · 한자 · 영어 · 예의 · 창의 · 상식, 일곱 가지가 나옵니다.</div>
      <div class="box">③ <span style="color:var(--green)">맞히면</span> 내 소가 밀어붙입니다!<br>
        박치기 · 밀치기 · 뿔치기 중 하나가 나와요.</div>
      <div class="box">④ <span style="color:#ff8f8b">틀리면</span> 상대 소가 밀고 들어옵니다.<br>
        밀리는 소는 중앙선에서 점점 멀어져요.</div>
      <div class="box">⑤ 한 경기는 <b>10문제</b>. 7문제를 맞히면 이기고,<br>
        7문제를 틀리면 기력이 다해 집니다.</div>
      <div class="box">💪 힘이 센 소는 가끔 <b>회심의 일격</b>을,<br>

}

window.addEventListener('pointerdown',function once(){
  initAudio(); if(bgmOn) bgmStart();
  window.removeEventListener('pointerdown',once);
});
drawCaster('normal');
</script>
