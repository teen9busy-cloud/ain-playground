<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아인이의 놀이터</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦖</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;
  --green:#22c55e;--purple:#a855f7;--blue:#3b82f6;--pink:#ec4899;
  --orange:#f97316;--sky:#0ea5e9;--rose:#f43f5e;--violet:#8b5cf6;--slate:#64748b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1000px 500px at 12% -8%, #dbeafe 0%, transparent 60%),
    radial-gradient(900px 460px at 92% 4%, #fce7f3 0%, transparent 58%),
    radial-gradient(800px 500px at 50% 108%, #dcfce7 0%, transparent 62%),
    #fdfcfb;
  min-height:100vh;overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;
  padding:24px 18px 40px;
}
a{text-decoration:none;color:inherit}

header{text-align:center;margin-bottom:26px}
.hi{font-size:18px;color:var(--muted);margin:0 0 8px;letter-spacing:.04em}
h1{margin:0;font-size:clamp(39px,7vw,70px);
   background:linear-gradient(100deg,#3b82f6,#a855f7 45%,#ec4899);
   -webkit-background-clip:text;background-clip:text;color:transparent;
   filter:drop-shadow(0 3px 6px rgba(0,0,0,.06))}
.tag{margin:12px 0 0;font-size:clamp(17px,3vw,22px);color:var(--muted)}
.count{display:inline-block;margin-top:14px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:9px 20px;font-size:17px;color:var(--muted);
  box-shadow:0 2px 8px rgba(0,0,0,.04)}

.grid{
  width:100%;max-width:1180px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:20px;
}
.card{
  background:#fff;border-radius:26px;padding:24px 22px 22px;
  border:1px solid var(--line);
  box-shadow:0 6px 18px rgba(15,23,42,.06);
  display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;
  transition:transform .16s ease, box-shadow .16s ease;
  min-height:230px;
}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(15,23,42,.12)}
.card:active{transform:translateY(-1px)}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:8px;background:var(--accent,#94a3b8)}
.emoji{font-size:58px;line-height:1.1}
.card h2{margin:0;font-size:29px;font-weight:normal}
.card p{margin:0;font-size:18px;line-height:1.55;color:var(--muted);flex:1 0 auto}
.skill{align-self:flex-start;font-size:15px;padding:8px 15px;border-radius:999px;
  background:var(--soft,#f1f5f9);color:var(--accent,#475569)}
.recent{position:absolute;top:16px;right:16px;font-size:14px;background:#fef3c7;color:#92400e;
  padding:5px 13px;border-radius:999px}

footer{margin-top:34px;text-align:center;color:#9ca3af;font-size:16px;line-height:1.9}
footer a{color:#9ca3af;border-bottom:1px dotted #d1d5db}
.err{background:#fff;border:2px dashed #fca5a5;color:#b91c1c;border-radius:16px;
  padding:20px 24px;font-size:18px;max-width:560px;text-align:center}
</style>
</head>
<body>

<header>
  <p class="hi">7살 아인이를 위한</p>
  <h1>아인이의 놀이터</h1>
  <p class="tag">놀면서 배우는 게임들 — 하고 싶은 걸 눌러보세요!</p>
  <span class="count" id="count">불러오는 중…</span>
</header>

<main class="grid" id="grid"></main>

<footer>
  놀이터에 새 게임 넣기 →
  <a href="admin.html" style="display:inline-block;min-height:52px;line-height:52px;padding:0 26px;font-size:18px">🔧 게임 추가하기</a>
</footer>

<script>
"use strict";

/* games.json을 못 읽는 경우(오프라인·file://)를 위한 기본 목록 */
const FALLBACK={games:[
 {id:'maze',title:'미로 대탐험',emoji:'🌀',desc:'공룡·자동차·로켓을 골라서 미로를 탈출해요.',skill:'길찾기 · 방향 감각',file:'games/maze.html',color:'green'},
 {id:'math',title:'큐브 산수',emoji:'🧮',desc:'더하기·빼기·곱하기·나누기를 블록으로 배워요.',skill:'수와 연산',file:'games/math.html',color:'purple'},
 {id:'coding',title:'코딩 대탐험',emoji:'🤖',desc:'명령을 순서대로 놓아 로봇을 움직여요.',skill:'순서 · 논리',file:'games/coding.html',color:'blue'},
 {id:'puzzle',title:'그림 퍼즐',emoji:'🧩',desc:'여섯 가지 그림을 조각으로 맞춰요.',skill:'공간 지각',file:'games/puzzle.html',color:'pink'},
 {id:'clock',title:'시계 읽기',emoji:'🕐',desc:'짧은 바늘·긴 바늘을 읽어요.',skill:'시간 개념',file:'games/clock.html',color:'orange'},
 {id:'memory',title:'기억력 짝 맞추기',emoji:'🃏',desc:'카드를 뒤집어 짝을 찾아요.',skill:'기억력 · 집중',file:'games/memory.html',color:'sky'},
 {id:'hangul',title:'한글 낱말 만들기',emoji:'🔤',desc:'그림을 보고 낱말을 완성해요.',skill:'한글 · 어휘',file:'games/hangul.html',color:'rose'},
 {id:'pattern',title:'규칙 찾기',emoji:'🔍',desc:'규칙을 찾아 빈칸을 채워요.',skill:'규칙 · 추론',file:'games/pattern.html',color:'violet'}
]};

const SOFT={green:'#dcfce7',purple:'#f3e8ff',blue:'#dbeafe',pink:'#fce7f3',
  orange:'#ffedd5',sky:'#e0f2fe',rose:'#ffe4e6',violet:'#ede9fe',slate:'#f1f5f9'};

function lastPlayed(){
  try{ return JSON.parse(localStorage.getItem('ain-last')||'{}'); }catch(e){ return {}; }
}
function markPlayed(id){
  try{ const m=lastPlayed(); m[id]=Date.now(); localStorage.setItem('ain-last',JSON.stringify(m)); }catch(e){}
}

function render(list){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const played=lastPlayed();
  const newest=Object.entries(played).sort((a,b)=>b[1]-a[1])[0];

  list.forEach(g=>{
    const a=document.createElement('a');
    a.className='card';
    a.href=g.file;
    a.style.setProperty('--accent','var(--'+(g.color||'slate')+')');
    a.style.setProperty('--soft',SOFT[g.color]||SOFT.slate);
    a.onclick=()=>markPlayed(g.id);
    a.innerHTML=`
      ${newest&&newest[0]===g.id?'<span class="recent">방금 했어요</span>':''}
      <div class="emoji">${g.emoji||'🎮'}</div>
      <h2>${g.title}</h2>
      <p>${g.desc||''}</p>
      ${g.skill?`<span class="skill">${g.skill}</span>`:''}`;
    grid.appendChild(a);
  });
  document.getElementById('count').textContent=`게임 ${list.length}개가 기다리고 있어요 🎈`;
}

fetch('games.json?t='+Date.now())
  .then(r=>{ if(!r.ok) throw new Error('no json'); return r.json(); })
  .then(d=>render(d.games||FALLBACK.games))
  .catch(()=>render(FALLBACK.games));
</script>
</body>
</html>
